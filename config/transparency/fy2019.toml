# FY2019 transparency resolutions: every year-specific fact the pipeline needs (GitHub #110).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2020-FY2026: Excel charts, one landscape table per chart page (no /Rotate this year).

fiscal_year = 2019
issue = 110
review_dir = "research/2026-10-22-fy19-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0
run_gap_pt = 3.0

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy15-20.md
# (FY2019 table; Reso 03-05 and 07-10 "confirmed (positional)") and
# data/combined/legistar_crosswalk.csv; read from Legistar on 2026-07-07, not re-queried here.
# The crosswalk holds no Legistar URL for FY2019, so no legistar_id. All 11 open with the
# Committee on Finance report, which prints the date ("This Resolution, dated ..."); none prints
# "Charts 1 through N".
numbers_source = "research/2026-07-07-legistar-links-fy15-20.md"

# Captions: Reso 01-07 and 11 print "CHART 1:" (no "#") on every chart page (484 pages); Reso
# 08-10 print "CHART #1:". `caption_no_hash = true` on a resolution says "CHART n:" is its house
# style, so those captions are not review items; any other odd caption still is (Reso 02 p.32
# "CHART 7 Cultural ..." with no colon, Reso 09 p.23 "CHART # 7:", Reso 10 p.15 "CHART 7:").

# Line-end hyphens (W5.wrap_hyphen): all 25, on 24 rows, were read by hand on 2026-10-22.
# 24 are compound words or names that keep the hyphen (after-school x5, enrollment-based x6,
# After-School x3, "Little-Tiger" x3, Ferreras-Copeland x2, pre-kindergarten, anti-displacement,
# t-shirts, NORC-SSP (the row below prints "NORC- SSP"), and Reso 04 p.66 row 4 " -" / "Public",
# a spaced separator). One is a separator printed without spaces: Reso 07 p.30 row 22,
# "CCNS Howard Beach Neighborhood SC-" / "Catholic Charities Neighborhood Services, Inc." (the
# rows around it print " - " between program and sponsor). Kept as printed; goes to review.
wrap_hyphen_review = ["Neighborhood SC-\nCatholic Charities"]

