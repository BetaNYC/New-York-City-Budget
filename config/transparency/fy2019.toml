[image]
# Same values as config/transparency/fy2026.toml.
dpi = 300
kernel_px = 60
region_pad_px = 8
row_tol_pt = 1.0
char_pad_px = 1
rule_pad_px = 1
ink_cell_px = 16
ink_min_region_px = 64
# Reso 09 (pp.11-44): bold capitals in the header ("EIN Number", "U/A") rise up to 1.23 pt above
# the box the text layer gives them (p.11: "E" box top 42.73 pt, ink from 41.5 pt), as on
# FY2022 Reso 02. The header's letter boxes are taken this much higher, on every page.
header_char_top_pt = 1.3
# Acceptance on the first chart page (Reso 01 p.18, first row): withholding the row, or one
# character of it, must make the ink check fire.
ink_acceptance_seq = 1
ink_acceptance_page = 18
ink_acceptance_row_id = "fy19-tr01-p018-r001"

# Named exceptions: places where the PDF disagrees with itself. Each must match exactly or the
# check still fails; each stays in the review file.

# Reso 01 p.1 prints "This Resolution, dated July 17, 2018"; Legistar has Res 0457-2018 adopted
# 2018-07-18 (the filename and resolution_date use Legistar's, as the 2026-07-07 notes say).
[[exceptions]]
check_id = "T13.printed_date"
resolution_seq = 1
printed_date = "July 17, 2018"

# Reso 01 p.108 prints "CHART 55: Purpose of Funds Changes - Fiscal 2018", but chart #55 is
# "Purpose of Funds Changes - Fiscal 2019" (pp.104-107) and pp.109-111 print "CHART 56: Purpose of
# Funds Changes - Fiscal 2018 (continued)". Read as the first page of chart #56.
[[exceptions]]
check_id = "T3.chart_number"
resolution_seq = 1
pdf_page = 108
printed = 55
read_as = 56

# Reso 03 p.55: the "Page 41" label is printed on top of the end of the *** footnote line (the
# text layer reads "ResolutPioange 41"), so no label is read; the labels around it (40, 42)
# count it.
[[exceptions]]
check_id = "T3.page_label"
resolution_seq = 3
pdf_page = 55

