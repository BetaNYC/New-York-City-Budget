check_id = "K.no_resolution_number"
resolution_seq = 4
pdf_page = 1
field = "resolution_number"
dollar_impact = 0
what_to_check = "Reso 04 (adopted 2024-10-23, per council.nyc.gov and its own p.1 'dated October 23, 2024') has no resolution number: the PDF prints none, and the 2026-07-07 Legistar pass did not find its matter (data/combined/legistar_crosswalk.csv: not_located). resolution_number left blank on its rows; resolution_date is set. Look it up in Legistar and add it to config/transparency/fy2025.toml."


# Named exceptions: places where the PDF disagrees with itself. Each must match exactly or the
# check still fails; each stays in the review file.

# Three chart pages print no "Page n" label under the chart, and the next label counts them
# (Reso 02: p.73 "Page 71", pp.74-75 none, p.76 "Page 74"; Reso 03: p.27 "Page 25", p.28 none,
# p.29 "Page 27"). All three are one-chart "Art a Catalyst for Change" pages.
[[exceptions]]
check_id = "T3.page_label"
resolution_seq = 2
pdf_page = 74

[[exceptions]]
check_id = "T3.page_label"
resolution_seq = 2
pdf_page = 75

[[exceptions]]
check_id = "T3.page_label"
resolution_seq = 3
pdf_page = 28

# Reso 06 p.6 row 24: "Brooklyn Kindergarten Society ***" (Speaker, $50,000), but the page
# prints only the * and ** footnotes. Kept as printed: org_marker "***", correction = 1.
[[exceptions]]
check_id = "T11.markers"
resolution_seq = 6
pdf_page = 6
row_index = 24

