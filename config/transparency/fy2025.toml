# FY2025 transparency resolutions: every year-specific fact the pipeline needs (GitHub #104).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2026 (config/transparency/fy2026.toml): Excel charts, one table per chart page.

fiscal_year = 2025
issue = 104
review_dir = "research/2026-10-21-fy25-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0          # pdfplumber default; these charts print real space glyphs
run_gap_pt = 3.0           # code/transreso/reader.py RUN_GAP

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy21-27.md
# (FY2025 table) and data/combined/legistar_crosswalk.csv; read from Legistar and
# council.nyc.gov on 2026-07-07, not re-queried here. `printed_date` is the date the PDF itself
# prints on p.1 ("This Resolution, dated ..."): Reso 01-10 carry the committee report and print
# it; Reso 11-13 carry the resolution text instead ("Preconsidered Res. No." left blank), print
# no date, and print "as set forth in Charts 1 through N" (`charts_printed`).
# Reso 04 (2024-10-23) has no Legistar matter number: the 2026-07-07 pass found it on
# council.nyc.gov only (absent from Legistar's phrase search), and the PDF prints none. Its
# `number` is left blank and the gap is a named review item (known_issues below).
numbers_source = "research/2026-07-07-legistar-links-fy21-27.md"

# Line-end hyphens (W5.wrap_hyphen): all 4 were read by hand on 2026-10-21 and are compound
# words that keep the hyphen (at-risk, evidence-based, In-School x2). None goes to review.
wrap_hyphen_review = []

