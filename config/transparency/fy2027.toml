# Named exceptions: places where the PDF disagrees with itself. Each must match exactly or the
# check still fails; each stays in the review file.
# A caption repeated on the next page without "(continued)" (same number, title and year):
# Reso 03 p.9 and Reso 04 p.9 (chart #6 Speaker's Initiative to Address Citywide Needs -
# Fiscal 2027, starts p.8 in both). Read as continuations.
[[exceptions]]
check_id = "T3.continued_missing"
resolution_seq = 3
pdf_page = 9

[[exceptions]]
check_id = "T3.continued_missing"
resolution_seq = 4
pdf_page = 9

# Reso 04 p.13 (chart #8 CASA - Fiscal 2027, Restler, $20,000): the Organization cell prints
# "113271472 - Urban Assembly Institute of Math and Science for Young Women (13K527)", an EIN where
# the organization's name belongs; its EIN cell prints 11-3271472, the EIN Reso 01 p.21 prints for
# Noel Pointer Foundation, Inc. So the page has 24 EIN-shaped words for 23 rows. Kept as printed;
# the row goes to review (known_issues below).
[[exceptions]]
check_id = "T5.ein_in_text"
resolution_seq = 4
pdf_page = 13
word = "113271472"

