# FY2027 transparency resolutions: every year-specific fact the pipeline needs (GitHub #102, #246).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it).

fiscal_year = 2027
review_dir = "research/2026-11-12-fy27-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0          # pdfplumber default; these charts print real space glyphs
run_gap_pt = 3.0           # code/transreso/reader.py RUN_GAP

# Resolution number and adoption date: from each matter's page on the Council's Legistar website,
# read 2026-11-12 (route and sha256 in source/FY27/README.md). `legistar_id` is left out: the
# FY2026 config's ids are the older Legistar ids, and these four were found only by the website's
# own matter ids (noted per resolution below), a different numbering. None of the four PDFs
# prints resolution text: each opens with "CHART #1: Local Initiatives - Fiscal 2027" on p.1.
# The text is the matter's separate "Res. No." attachment (a Word file), kept beside each PDF as
# `text` with its `text_sha256`; the run reads the fiscal years it names (T12) from there, and
# `charts_printed` is its "as set forth in Charts 1 through N". It prints no date, so
# `printed_date` is blank.
numbers_source = "source/FY27/README.md"

# Line-end hyphens (W5.wrap_hyphen): all 7 were read by hand from the flags file on 2026-11-12.
# Six are compound words and keep the hyphen (one-on-one, School-Community x2, YM-YWHA,
# back-to-school x2). This one could be "Special Projects - Council District 16" with the spaces
# lost, so it goes to review.
wrap_hyphen_review = ["Projects-\nCouncil"]

