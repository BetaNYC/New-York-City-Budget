# FY2023 transparency resolutions: every year-specific fact the pipeline needs (GitHub #106).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2024-FY2026: Excel charts, one landscape table per chart page (no /Rotate this year).

fiscal_year = 2023
issue = 106
review_dir = "research/2026-10-21-fy23-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0
run_gap_pt = 3.0

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy21-27.md
# (FY2023 table, all "confirmed") and data/combined/legistar_crosswalk.csv; read from Legistar
# on 2026-07-07, not re-queried here. All 14 open with the Committee on Finance report, which
# prints the date ("This Resolution, dated ..."); none prints "Charts 1 through N".
numbers_source = "research/2026-07-07-legistar-links-fy21-27.md"

# Line-end hyphens (W5.wrap_hyphen): all 33, on 31 rows, were read by hand on 2026-10-21.
# Every one is a compound word or name that keeps the hyphen (low-income x26 on Reso 08
# pp.55-58, Anti-Hate, Nature-Based, pre-kindergarten, culturally-sensitive, Ehrenreich-Austin,
# de-escalation, anti-violence), or a " - " separator whose spaces the clean value keeps
# (Reso 03 p.91, Reso 12 p.38). None goes to review.
wrap_hyphen_review = []

