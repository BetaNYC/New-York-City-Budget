# Named exceptions: places where the PDF disagrees with itself. Each must match exactly or the
# check still fails; each stays in the review file.

# Chart pages that print no "Page n" label; the labels after them count them (Reso 08: p.43
# "Page 41", p.44 none, p.45 "Page 43"; Reso 09: p.28 "Page 26", pp.29-31 none, p.32 "Page 30").
# Checked on the rendered page (Reso 09 p.29). All four are Fiscal 2022 charts.
