# FY2021 transparency resolutions: every year-specific fact the pipeline needs (GitHub #108).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2022-FY2026: Excel charts, one landscape table per chart page (no /Rotate this year).

fiscal_year = 2021
issue = 108
review_dir = "research/2026-10-21-fy21-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0
run_gap_pt = 3.0

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy21-27.md
# (FY2021 table, all "confirmed") and data/combined/legistar_crosswalk.csv; read from Legistar
# on 2026-07-07, not re-queried here. All 8 open with the Committee on Finance report, which
# prints the date ("This Resolution, dated ..."); none prints "Charts 1 through N".
numbers_source = "research/2026-07-07-legistar-links-fy21-27.md"

# Line-end hyphens (W5.wrap_hyphen): all 12, on 12 rows, were read by hand on 2026-10-21.
# All are compound words or names that keep the hyphen (after-school x2, Nature-Based, NORC-SSP,
# Avenue-Arts x2, Bedford-Stuyvesant, on-site, state-of-the-art x2, one-to-one, Self-Awareness).
# None goes to review.
wrap_hyphen_review = []

