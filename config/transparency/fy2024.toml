# FY2024 transparency resolutions: every year-specific fact the pipeline needs (GitHub #105).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2025 and FY2026: Excel charts, one table per chart page. Reso 01 pp.3-61 carry /Rotate (the
# charts are landscape pages stored portrait); pdfplumber and pdfium both read them as displayed,
# so bbox_pt is in display coordinates here and is unrotated at promotion.

fiscal_year = 2024
issue = 105
review_dir = "research/2026-10-21-fy24-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0
run_gap_pt = 3.0

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy21-27.md
# (FY2024 table, all "confirmed") and data/combined/legistar_crosswalk.csv; read from Legistar
# on 2026-07-07, not re-queried here. All 9 open with the Committee on Finance report, which
# prints the date on p.1 ("This Resolution, dated ..."); none prints "Charts 1 through N".
numbers_source = "research/2026-07-07-legistar-links-fy21-27.md"

# Line-end hyphens (W5.wrap_hyphen): all 3 were read by hand on 2026-10-21. Two are compound
# words that keep the hyphen (Self-Determination, Anti-Hate). This one could be "Special Projects
# - Council District 1" with the spaces lost, so it goes to review.
wrap_hyphen_review = ["Projects-\nCouncil"]

