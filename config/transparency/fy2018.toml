[image]
# Same values as config/transparency/fy2026.toml.
dpi = 300
kernel_px = 60
region_pad_px = 8
row_tol_pt = 1.0
char_pad_px = 1
rule_pad_px = 1
ink_cell_px = 16
ink_min_region_px = 64
# Acceptance on the first chart page (Reso 01 p.13, first row): withholding the row, or one
# character of it, must make the ink check fire.
ink_acceptance_seq = 1
ink_acceptance_page = 13
ink_acceptance_row_id = "fy18-tr01-p013-r001"
# The row's narrowest marks ("i", "l" in "Brooklyn Historical", 1.81 pt wide; the "*" in the
# pre-qualification column, 3.17 pt) ink fewer pixels than ink_min_region_px, so withholding one
# cannot fire. The withheld letter is the smallest at least this wide.
ink_acceptance_min_char_pt = 4.0

[[known_issues]]
check_id = "K.adopted_before_fy"
resolution_seq = 1
pdf_page = 1
field = "resolution_date"
dollar_impact = 0
what_to_check = "Reso 01 (Res 1563-2017) is dated June 21, 2017, before Fiscal 2018 began (July 1, 2017) but after the Fiscal 2018 budget was adopted (June 6, 2017). Its p.1 changes designations in the Fiscal 2018 Expense Budget (charts 1-29, 38) and the Fiscal 2017 and 2016 budgets (charts 30-37, 39). Kept in the FY2018 series, as the 2026-07-07 Legistar notes and data/combined/legistar_crosswalk.csv file it; each row's budget_fiscal_year is its chart's. Confirm it belongs with FY2018 rather than FY2017."

