# FY2018 transparency resolutions: every year-specific fact the pipeline needs (GitHub #111).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2019-FY2026: Excel charts, one landscape table per chart page (no /Rotate this year).

fiscal_year = 2018
issue = 111
review_dir = "research/2026-10-22-fy18-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0
run_gap_pt = 3.0

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy15-20.md
# (FY2018 table; Reso 03, 05, 06 and 09-12 "confirmed (positional)") and
# data/combined/legistar_crosswalk.csv; read from Legistar on 2026-07-07, not re-queried here.
# The crosswalk holds no Legistar URL for FY2018, so no legistar_id. All 12 open with the
# Committee on Finance report, which prints the date ("This Resolution, dated ..."); none prints
# "Charts 1 through N".
#
# Reso 01 (Res 1563-2017) is dated June 21, 2017, nine days before Fiscal 2018 began (July 1,
# 2017) and after the Fiscal 2018 budget was adopted (June 6, 2017). Its p.1 says it changes
# designations "in accordance with the Fiscal 2018 Expense Budget" (charts 1-29 and 38) and the
# Fiscal 2017 and 2016 budgets (charts 30-37, 39). The 2026-07-07 notes and the crosswalk file it
# as FY2018 Transparency Reso 01. Kept in FY2018; a review item (known_issues below).
numbers_source = "research/2026-07-07-legistar-links-fy15-20.md"

# Captions: every resolution prints "CHART 1:" (no "#") on every chart page; `caption_no_hash`
# says that is the resolution's house style, so those captions are not review items.

wrap_hyphen_review = []

