# FY2022 transparency resolutions: every year-specific fact the pipeline needs (GitHub #107).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2023-FY2026: Excel charts, one landscape table per chart page (no /Rotate this year).

fiscal_year = 2022
issue = 107
review_dir = "research/2026-10-21-fy22-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0
run_gap_pt = 3.0

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy21-27.md
# (FY2022 table, all "confirmed") and data/combined/legistar_crosswalk.csv; read from Legistar
# on 2026-07-07, not re-queried here. All 14 open with the Committee on Finance report, which
# prints the date ("This Resolution, dated ..."); none prints "Charts 1 through N".
numbers_source = "research/2026-07-07-legistar-links-fy21-27.md"

# Line-end hyphens (W5.wrap_hyphen): all 128, on 75 rows, were read by hand on 2026-10-21.
# 75 are compound words or names that keep the hyphen (community-based x63, after-school,
# Self-Awareness, Brooks-Powers, Nature-Based, re-entry, to-be-named, car-free, an address
# "107-33 Sutphin Blvd"); 53 are a " - " separator whose spaces the clean value keeps
# ("Pantry - EFRO# 85545", "- Council District …"). None goes to review.
wrap_hyphen_review = []

