# FY2026 transparency resolutions: every year-specific fact the pipeline needs (GitHub #103).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it).

fiscal_year = 2026
review_dir = "research/2026-10-21-fy26-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0          # pdfplumber default; these charts print real space glyphs
run_gap_pt = 3.0           # code/transreso/reader.py RUN_GAP

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy21-27.md
# (FY2026 table, all "confirmed"; read from Legistar on 2026-07-07, not re-queried here).
# `printed_date` is the date the PDF itself prints, with its page; Reso 03-10 print none (their
# p.1 is the resolution text, "Preconsidered Res. No." left blank). `charts_printed` is
# "as set forth in Charts 1 through N" on p.1; Reso 01-02 carry the committee report instead,
# which names no chart count.
numbers_source = "research/2026-07-07-legistar-links-fy21-27.md"

# Line-end hyphens (W5.wrap_hyphen): all 97 were read by hand from the flags file on
# 2026-10-21. 96 are compound words and keep the hyphen (faith-based x66, non-profits x22,
# low-income x3, science-based, Meals-on-wheels, Elliot-Chelsea, School-Community x2). This one
# could be "Heart Paws - Canine Therapy Program" with the spaces lost, so it goes to review.
wrap_hyphen_review = ["Paws-\nCanine"]

