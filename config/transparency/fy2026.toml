region_pad_px = 8
row_tol_pt = 1.0
char_pad_px = 1
rule_pad_px = 1
ink_cell_px = 16
ink_min_region_px = 64
# Acceptance: withholding this row (Reso 08 p.19, Banks / Made in Brownsville, ($15,000)), or
# one character of it, must make the ink check fire. The page also holds the clipped
# "Jozef Pilsudski" runs, so a clean pass shows hidden letters really are hidden.
ink_acceptance_seq = 8
ink_acceptance_page = 19
ink_acceptance_row_id = "fy26-tr08-p019-r003"


# Named exceptions: places where the PDF disagrees with itself. Each must match exactly or the
# check still fails; each stays in the review file.
# Reso 06 chart #2 "Aging Discretionary - Fiscal 2023" (p.5): the resolution text (p.1) names
# Fiscal 2024, 2025 and 2026 only, and the chart sits between Fiscal 2026 charts #1 and #3. Its
# rows name Council Member Zhuang, who took office in January 2024 (after FY2023 ended), so
# "2023" looks like a typo for 2026. Kept as printed; flagged.
[[exceptions]]
check_id = "T12.fiscal_year"
resolution_seq = 6
chart_number = 2
fy_printed = "2023"

# Reso 02 p.114 row 1 (chart #64, Diaspora Community Services, $63,165): the line "Funding
# supports health and wellness services for children and caregivers," is drawn on top of the
# purpose's last line "pregnancy through early childhood."; the page shows only that last line
# (row 2's purpose starts "focusing on ..."). Read together, the two lines came out interleaved
# ("pFurengdninagn ..."). On this page a run that starts on top of a cell's own text is hidden
# (kept in hidden_text) and the row goes to review (T7.overlaid), as FY2022 Reso 09 p.38 (#196).
[[exceptions]]
check_id = "T7.overlaid"
resolution_seq = 2
pdf_page = 114

