# FY2020 transparency resolutions: every year-specific fact the pipeline needs (GitHub #109).
# Shared code: code/transreso/ (and code/schedc/, code/schedc_cv/ underneath it). Same layout as
# FY2021-FY2026: Excel charts, one landscape table per chart page (no /Rotate this year).

fiscal_year = 2020
issue = 109
review_dir = "research/2026-10-21-fy20-transparency-review"   # outputs land in <review_dir>/data
x_tolerance = 3.0
run_gap_pt = 3.0

# Resolution number and adoption date: from research/2026-07-07-legistar-links-fy15-20.md
# (FY2020 table, all "confirmed"; Reso 02-05 "confirmed (positional)") and
# data/combined/legistar_crosswalk.csv; read from Legistar on 2026-07-07, not re-queried here.
# The crosswalk holds no Legistar URL for FY2020, so no legistar_id. All 8 open with the
# Committee on Finance report, which prints the date ("This Resolution, dated ..."); none prints
# "Charts 1 through N".
numbers_source = "research/2026-07-07-legistar-links-fy15-20.md"

# Line-end hyphens (W5.wrap_hyphen): all 144, on 96 rows, were read by hand on 2026-10-22.
# 143 are compound words or names that keep the hyphen (community-based x50, child-parent x24,
# court-involved x24, non-governmental x24, enrollment-based x5, Anti-Violence x4,
# Bedford-Stuyvesant x4, Watson-Gleason x2, 10-week, COVID-19, Meet-the-Author, Nature-Based,
# after-school, anti-bullying). One is a separator printed without spaces: Reso 05 p.67 row 4,
# "Millennium Development-" / "Millennium Youth Services" (the row above prints
# "Millennium Development - Millennium Youth Services"). Kept as printed; goes to review.
wrap_hyphen_review = ["Millennium Development-\nMillennium Youth Services"]

