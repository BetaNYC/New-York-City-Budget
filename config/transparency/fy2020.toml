# Acceptance on the first chart page (Reso 01 p.13, first row): withholding the row, or one
# character of it, must make the ink check fire.
ink_acceptance_seq = 1
ink_acceptance_page = 13
ink_acceptance_row_id = "fy20-tr01-p013-r001"

# Named exceptions: places where the PDF disagrees with itself. Each must match exactly or the
# check still fails; each stays in the review file.

# First page of a chart printing "(continued)": Reso 02 p.34 (chart #12 Healthy Aging
# Initiative; p.33 is #11, and the labels "Page 18", "Page 19" run on). Read as the chart's start.
[[exceptions]]
check_id = "T3.continued_start"
resolution_seq = 2
pdf_page = 34

# A caption repeated on the next page without "(continued)": Reso 05 p.47 (chart #28 Public
# Health Funding Backfill, starts p.46). Read as its continuation.
[[exceptions]]
check_id = "T3.continued_missing"
resolution_seq = 5
pdf_page = 47

# Reso 06 pp.25-26 print "CHART #: Purpose of Funds Changes - Fiscal 2020 (continued)", with no
# number, under chart #16 "Purpose of Funds Changes - Fiscal 2020" (p.24). Read as chart #16.
[[exceptions]]
check_id = "T3.continued_number"
resolution_seq = 6
pdf_page = 25

[[exceptions]]
check_id = "T3.continued_number"
resolution_seq = 6
pdf_page = 26

