# FY2024 Section 254 capital supporting detail ("Sec254 Supporting Detail Book 7.10.2023"): every
# year-specific fact code/review_capital_sd.py needs, and nothing else. Values read off the pages
# (triage: data/fy24_capital_sd_pages.csv).
#
# The PDF is AES-256 encrypted (V5 R6) with an empty user password: it opens and its text
# extracts. Its owner permissions (/P -1052) allow printing and extraction for accessibility,
# not copying.

fiscal_year = 2024
pdf = "source/FY24/FY2024-Sec254-Supporting-Detail-Book_7.10.2023pwp-2.pdf"
sha256 = "c13971771d24ca6815b426c891f011aa9ee97f09caacf813c70479b05321cce4"
review_dir = "research/2026-10-21-fy24-capital-terms-review"   # outputs land in <review_dir>/data
prefix = "fy24"                                                # output file names: <prefix>_capital_sd_*
issue = 105

# The four FY columns, as printed in the column header.
fys = ["fy2024", "fy2025", "fy2026", "fy2027"]

# The Word export's fonts on detail pages (Parts I and II), as FY2025.
export_fonts = ["ArialMT", "Arial-BoldMT", "TimesNewRomanPS-BoldMT", "BLBURV+TimesNewRomanPS-BoldMT", "LNEXBB+TimesNewRomanPSMT"]

# Part III (pp.71-78) is a second export (subsets BCDEEE+..BCDHEE+); its amounts sit left of the
# FY header's right edge (3.6-5.2 pt measured on pp.71 and 78), as FY2025's do.
part3_amount_x1_tol = 6.0

# The comparison source for FY2024 is NYC Open Data t474-a92g (no Council workbook found;
# data/capital/README.md). Its accents are UTF-8 bytes read as cp437 (`Oss├⌐`, `Vel├ízquez`):
# C9 decodes them before comparing. Nothing is written back.
workbook_mojibake = "utf-8"

# C7: Part III separates organizations with 0.10-0.17 pt, 50% grey hairlines, under a pixel at
# 300 dpi. Rules thinner than this are counted, not listed (as FY2025).
c7_hairline_pt = 0.25

# Page map: each kind's inclusive page ranges, checked against each page's furniture (H3).
# Every page is upright (no /Rotate).
[pages]
cover = [[1, 1]]
contents = [[2, 2]]
divider = [[3, 3], [62, 62], [70, 70]]
summary = [[61, 61]]
part1 = [[4, 60]]
part2 = [[63, 69]]
part3 = [[71, 78]]
[rotate]
part1 = 0
part2 = 0
part3 = 0

# Part II rows not in Part I are expected only in this series (MA IDs on 0N lines, as FY2025).
[part2_only]
id_prefix = "MA"
line_prefix = "0N"

# --selftest-ink: drop this row's words from the emitted set on this page; C8 must fire.
[ink_selftest]
page = 4
sub_id = "AG CN001"
