[structure]
award_header_re = "(Tax ID|EIN).*Amount"
summary_title = "Fiscal 2026 Council Initiatives"
# Two categories title their summary table differently (pp.153, 162).
summary_titles = ["Fiscal 2026 Council Initiatives", "Fiscal 2026 Food Initiatives",
                  "Fiscal 2026 Higher Education Initiatives"]
box_amount_on_second_row = true   # p.157: a box title wraps, its amount on the second line
amount_without_dollar = true      # p.111: Ghetto Film School's amount printed "75,000" (flagged)
banner_min_size = 19.0     # category banners are 20 pt bold (e.g. p.11 "Anti-Poverty")
statement_prefix = "Designation Method:"
# FY2026 portrait pages draw box + description + statement + award table as one ruled table
# (p.36), and draw a rule between the two lines of a long name (p.130 "and Inwood").
split_merged_tables = true
continuation_rows = true
# An award table that runs over a page break without repeating its header (pp.157, 195).
headerless_continuation = true
page_furniture_re = "(\\d+|Page \\d+|Fiscal Year 2026 Adopted Expense Budget Adjustment Summary)"
header_labels = [
  ["Council Member", "member"],
  ["Sponsor", "sponsor"],
  ["Borough Delegation", "delegation"],
  ["Legal Name of Organization [-–] Program Name", "org"],
  ["Legal Name of the Organization – Program Name", "org"],   # pp.173-177
  ["Legal Name of Organization - Program", "org"],            # p.273 (printed cut short)
  ["Legal Name", "org"],                                      # pp.180, 186
  ["Tax ID", "ein"],
  ["EIN", "ein"],
  ["Amount", "amount"],
  ["Agency", "agency"],
  ["Purpose of Funds", "purpose"],
]

# Designation statements (text after "Designation Method:"), checked in order. FY2026 words
# them many ways (60 distinct strings); each pattern names the pages it was written from. The
# text layer splits some words ("h as" p.170, "designate d" p.166, "2026 :" p.170); the
# patterns allow exactly those splits and nothing else. Kinds (code/schedc/reconcile.py):
#   partial       reserve post-adoption + designated to the rows printed
#   reserve_only  a stated amount post-adoption, no rows
#   reserve_all   "will designate awards post-adoption" (no amount: the whole box; p.111)
#   designated    "has designated $N to the following providers" (p.189)
#   direct        "has designated directly to the City University of New York" (pp.162-164)
#   full          the rows are the whole box
[[statements]]
kind = "partial"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+) post-adoption(, including \\$[\\d,]+ for the AAPI curriculum,)? and h ?as designate ?d \\$(?P<designated>[\\d,]+) (to )?the following providers?( for Fiscal 2026)? ?[:.]$"
[[statements]]
kind = "reserve_only"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+) post[- ]adoption( for Fiscal 2026)? ?[.:]$"
[[statements]]
kind = "reserve_all"
re = "^The (City )?Council will designate awards post-adoption ?[.:]$"
[[statements]]
kind = "designated"
re = "^The (City )?Council has designated \\$(?P<designated>[\\d,]+) to the following providers for Fiscal 2026 ?:$"
[[statements]]
kind = "direct"
re = "^The (City )?Council has designated (\\$(?P<designated>[\\d,]+) )?directly to the City University of New York( and \\$[\\d,]+ directly to the Department of Education| for Fiscal 2026| for the following institutes for Fiscal 2026 ?:)?\\.?$"
[[statements]]
kind = "full"
re = "^The (City )?Council h ?as designated (to )?the following providers? for Fiscal 2026 ?[:.]:?$"

# Image lattice and ink: FY2027's values (same 10-11 pt body type). On FY2026 they give 0 ink
# regions (478 loose px of 263,337,561 ink px). The 60 px kernel cannot see a table one row tall
# (~53 px rules; pp.48, 157): those 2 rows are review items, not a reason to shrink the kernel
# toward glyph-stem size (~33 px).
[image]
dpi = 300
kernel_px = 60
region_pad_px = 8
row_tol_pt = 1.0
carry_header = true   # pp.157, 195: the image side reads a headerless carry-over with its last header
char_pad_px = 1
rule_pad_px = 1
ink_cell_px = 16
ink_min_region_px = 64
ink_acceptance_page = 176
ink_acceptance_award_id = "fy26-p176-t00-r003"   # Bronx Defenders $5,533,333, one of the 13 rows the old parser lost
ink_acceptance_char = "alnum"   # the row's smallest box is a comma, below the region floor

