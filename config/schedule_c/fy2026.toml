# FY2026 Schedule C: every year-specific fact the pipeline needs, and nothing else (PLAN §7).
# Each value cites the page it was read from. Shared code lives in code/schedc/.

fiscal_year = 2026
pdf = "source/FY26/Fiscal-2026-Schedule-C-4.pdf"
sha256 = "58532138d5bcd9e013ff377e2d8638dc530b1c88d74a91ee1e6597c66589b074"
pages = 469
x_tolerance = 3.0          # pdfplumber default; FY2026 text has real space glyphs (PLAN §2.2)
review_dir = "research/2026-10-21-fy26-schedule-c-review"   # outputs land in <review_dir>/data
# Disclosure (report only): data/fy26/expense_disclosure, parsed from the workbook's sheet
# 'FY26 (09-14-26)'. H17 floor: the 2026-10-19 prototype matched 9,529 rows (PLAN §2.3).
disclosure_note = "workbook sheet 'FY26 (09-14-26)'"
h17_floor = 9529

# The 25 categories, as printed on each category banner (20 pt bold; ToC p.3 uses capitals and
# says "DOMESTIC VIOLENCE", "HIGHER EDUCATION INITIATIVES"; the banners are the record).
categories = [
  "Anti-Poverty", "Boroughwide Needs", "Community Development",
  "Community Safety and Victim Services", "Criminal Justice Services", "Cultural Organizations",
  "Domestic Violence", "Education", "Environmental Initiatives", "Food Initiatives",
  "Health Services", "Higher Education Initiatives", "Homeless Services", "Housing",
  "Immigrant Services", "Legal Services", "Mental Health Services", "Older Adult Services",
  "Parks and Recreation Services", "Public Safety",
  "Small Business Services and Workforce Development",
  "Speaker’s Initiative to Address Citywide Needs", "Veteran Services",
  "Young Women’s Initiative", "Youth Services",
]

# Section page ranges, read from the pages (Appendix titles first printed on pp.280, 306, 427;
# ToC p.3; first category banner p.11).
[[page_ranges]]
