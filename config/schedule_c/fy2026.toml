# Named exceptions: places where the PDF disagrees with itself. Each must match exactly
# (page, expected, observed) or the check still fails. Read on the pages; none is corrected.
# Immigrant Services (p.173): the summary lines add to $86,092,141; TOTAL prints $86,091,341.
[[exceptions]]
check = "H10.category_total"
page = 173
expected = 86091341
observed = 86092141
note = "PDF self-error: summary lines sum $86,092,141, TOTAL printed $86,091,341 (pending review)"
# Cultural Immigrant Initiative (p.98): "will designate $597,000 post-adoption and has
# designated $6,798,000"; $597,000 + $6,798,000 = the $7,395,000 box, but the 383 rows printed
# under it (pp.99-111) add to $6,783,000. Every page's EIN count equals its row count.
[[exceptions]]
check = "H12.designated_sum"
page = 98
expected = 6798000
observed = 6783000
note = "PDF self-error: statement $6,798,000 designated, rows sum $6,783,000 (pending review)"
# The roll-up gap is exactly those two: -$15,000 (p.98) + $800 (p.173 TOTAL vs its lines).
[[exceptions]]
check = "H13.rollup"
page = 0
expected = 665080021
observed = 665065821
note = "the -$15,000 of p.98 and the $800 of p.173 (pending review)"
# Two EINs printed with 8 digits (known going in, #103). Clean EIN left blank.
