# FY2018 Schedule C: every year-specific fact the pipeline needs, and nothing else (PLAN §7).
# Each value cites the page it was read from. Shared code lives in code/schedc/.

fiscal_year = 2018
pdf = "source/FY18/FY-2018-Schedule-C-Cover-Template-FINAL-MERGE.pdf"
sha256 = "d4f1374ee16d8503f54cc0e5b43a2c5077b4f9f2d382df0169267d1b9e5fc5cb"
pages = 357
x_tolerance = 3.0          # pdfplumber default; FY2018 text has real space glyphs (PLAN §2.2)
review_dir = "research/2026-10-22-fy18-schedule-c-review"   # outputs land in <review_dir>/data
# Disclosure (report only): data/fy18/expense_disclosure. There was no 2026-10-19 prototype for
# FY2018, so no H17 floor (0).
disclosure_note = "as committed in data/fy18/expense_disclosure"
h17_floor = 0

# The 26 categories, as printed on each category banner (20 pt bold, pp.11-126): FY2019's 27
# but Libraries, which FY2018 does not print.
categories = [
  "Anti-Poverty", "Boroughwide Needs", "Children’s Services", "Community Development",
  "Criminal Justice Services", "Cultural Organizations", "Domestic Violence Services",
  "Education", "Environmental Initiatives", "Food Initiatives", "Government Officials",
  "Health Services", "Higher Education Initiatives", "Homeless Services", "Housing",
  "Immigrant Services", "Legal Services", "Mental Health Services",
  "Parks and Recreation Services", "Public Safety", "Senior Services",
  "Small Business Services and Workforce Development",
  "Speaker’s Initiative to Address Citywide Needs", "Veteran Services",
  "Young Women’s Initiative", "Youth Services",
]

