# Designation statements (text after "Designation Method:"), checked in order. Shared with
# FY2019:
#   - "will designate $N post-adoption and has designated the following providers" (kind
#     `reserve_rows`, rows = box - reserve, e.g. p.36), or the other way round, "has designated
#     the following providers for Fiscal 2018 and will designate $N post-adoption" (p.41);
#   - the whole box later, "will designate post-adoption" (e.g. p.50): kind reserve_all;
#   - straight to CUNY or DOE (pp.69-70, 129): kind direct;
#   - "has designated (to) the following provider(s) for Fiscal 2018": kind full.
[[statements]]
kind = "reserve_rows"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) (awards )?(post[- ][Aa]doption|after adoption)[.,]? (and )?([Tt]he (City )?Council )?has (designated (to )?the following providers?|made the following designations) (for|in) Fiscal 2018 ?[:.]?$"
[[statements]]
kind = "reserve_rows"
re = "^The (City )?(Council )?has designated (to )?the following providers? for Fiscal 2018 and will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ](budget )?[Aa]doptions? ?[.:]$"
[[statements]]
kind = "reserve_all"
re = "^(The (City )?Council will designate (awards |this funding |to service providers )?|This initiative will be designated )(post[- ](budget )?adoption|after adoption)( for Fiscal 2018)? ?[.:]?$"
[[statements]]
kind = "direct"
re = "^This funding is allocated directly to (the )?(City University of New York|CUNY|NYC Department of Education|Department of Education|Department for the Aging)( for the following institutes)?[.:]$"
[[statements]]
kind = "full"
re = "^The (City )?(Council )?has designated (to )?(the )?following providers? (for|in) Fiscal 2018 ?[:.]$"

# FY2018's own wordings:
#   - the whole box later: "will designate allocation post-budget adoption" (e.g. p.36), "will
#     designate this initiative / this allocation post-adoption" (pp.38, 125, 128-129), "The
#     Borough Presidents will designate the organizations and the amount each will receive
#     under this initiative post-budget adoption" (p.99): kind reserve_all;
#   - straight to an agency: "provided directly to the Department of City Administrative
#     Services" (p.39), "to the agency" (p.80), the City Clerk, the Brooklyn Borough President
#     (p.62), HPD (and DCA) (p.76), Parks (p.91), DYCD (p.125), ACS (p.126), "NYC Health+Hospital"
#     (p.127), "will direct the funding directly to the agency" (p.67), "These funds are allocated
#     directly to agencies for Fiscal 2018: Agency City University of New York Department of
#     Education" (p.69): kind direct;
#   - NORCs (p.101): "will designate NNORC allocations, which total $1.9 million, post-budget
#     adoption. The Council will designate $529,000 of the total $1.95 million for vertical NORCs
#     post-budget adoption and has designated the following providers": both held, the rest rows;
#   - one named provider (p.98), or "the Department of Youth and Community Development and the
#     providers listed below" (p.124, COMPASS): kind full.
[[statements]]
kind = "reserve_all"
re = "^The +City Council will designate (allocation|this initiative|this allocation) post-(budget )?adoption\\.$"
[[statements]]
kind = "reserve_all"
re = "^The Borough Presidents will designate the organizations and the amount each will receive under this initiative post-budget adoption\\.$"
[[statements]]
kind = "direct"
re = "^((This|The) funding is (allocated|provided) directly to (the )?(NYC Department of Youth and Community Development|Department of City Administrative Services|agency|Office of the City Clerk|Brooklyn Borough President|NYC Department of Housing Preservation and Development( and the Department of Consumer Affairs)?|NYC Department of Parks and Recreation|Department of Youth and Community Development|NYC Administration for Children’s Services|NYC Health\\+Hospital)\\.?|The City Council will direct the funding directly to the agency in Fiscal 2018\\.|These funds are allocated directly to agencies for Fiscal 2018: Agency City University of New York Department of Education)$"
[[statements]]
kind = "reserve_rows"
re = "^The City Council will designate NNORC allocations, which total \\$(?P<reserve>\\d+(\\.\\d+)? million), post-budget adoption\\. The Council will designate \\$(?P<reserve2>[\\d,]+) of the total \\$1\\.95 million for vertical NORCs post-budget adoption and has designated the following providers and amounts for Fiscal 2018\\.$"
[[statements]]
kind = "full"
re = "^The City Council has designated (the Metropolitan Council on Jewish Poverty as the provider for this initiative for Fiscal 2018\\.|the Department of Youth and Community Development and the providers listed below:)$"

