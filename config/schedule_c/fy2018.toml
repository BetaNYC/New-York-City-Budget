[structure]
award_header_re = "(Tax ID|EIN).*Amount"
summary_title = "Fiscal 2018 Council Initiatives"
summary_titles = [
  # The category summary tables: "Fiscal 2018 Council ... Initiatives" (e.g. p.44), or without
  # "Council" (e.g. p.40 "Fiscal 2018 Criminal Justice Services Initiatives").
  "Fiscal 2018 Council", "Fiscal 2018 Criminal Justice Services Initiatives",
  "Fiscal 2018 Food Initiatives", "Fiscal 2018 Health Services Initiatives",
  "Fiscal 2018 Higher Education Initiatives", "Fiscal 2018 Mental Health Services Initiatives",
  "Fiscal 2018 Veteran Services Initiatives", "Fiscal 2018 Young Women’s Initiatives",
  "Fiscal 2018 Youth and Community Development Initiatives",
  "Agency | Initiative | Amount",
]
banner_min_size = 19.0     # category banners are 20 pt bold (e.g. p.11 "Anti-Poverty")
statement_prefix = "Designation Method:"
# Each switch below changes FY2018's output when turned off (checked one by one).
# Box + description + statement + award table drawn as one ruled table.
split_merged_tables = true
# A rule between the two lines of a long name (3 rows).
continuation_rows = true
# An award table carried over a page without a header (59 rows).
headerless_continuation = true
# Tables ruled with horizontal lines only (14 tables, 143 rows; e.g. pp.81, 93, 96).
hrule_tables = true
# From FY2019-FY2026:
# A fourth column, "School", between EIN and Amount (pp.92-93, Art as a Catalyst for Change).
hrule_extra_column = true
# Amounts printed with no "$" in the member tables and Appendices B and C (p.12 "5,000"); a
# routine flag there (W.amount_bare, 4,512 rows).
amount_without_dollar = true
bare_amounts = true
# "Designation Method:" alone, the statement beside it as its own loose line (FY2020), or
# centred between the statement's two lines (FY2019's span).
statement_beside_label = true
statement_beside_label_span = true
# The award header printed as loose text right under the statement ends it (FY2021).
header_band_words = true
# A box title's last letter drawn apart, in its own cell (FY2019).
box_title_tail = true
# An h-rule table whose first row prints an EIN of the wrong length (FY2020; p.107 Urban
# Health Plan, Inc. "15-24042810").
hrule_short_ein = true
# New for FY2018 (code/schedc/vector.py, structure.py, checks.py):
# Appendix A prints every amount with cents ("$30,000.00", p.131; 537 rows): an amount word in
# the vector pass, read as the whole dollars, a routine flag (W.amount_cents).
amount_cents = true
# A row printing an EIN of the wrong length is an award row, not an initiative box (p.107).
short_ein_rows = true
# An h-rule stack ends where a ruled table starts, and skips one at its head (p.107: the rules
# round Urban Health Plan's row are the next table's top and bottom; p.93: the header drawn as
# its own table over the h-rule rows).
hrule_skip_kept = true
# A box's title bar printed above its table, outside the rules (pp.53, 94-97: SAVE's and Crisis
# Management System's parts; 11 boxes, warn review rows).
box_title_above = true
# A TOTAL row closing an award table (14 tables, e.g. p.64 Access Health NYC): not an award;
# checked against the rows above it (H12.table_total).
award_table_totals = true
# Also new for FY2018, with no switch: the "Fiscal Conduit" / "FC EIN" columns (header labels
# `conduit`, `conduit_ein`), read into `fiscal_conduit` and `fiscal_conduit_ein` (#209); a row
# printing one is flagged and a warn review row (W.fiscal_conduit, 50 rows); the FC EIN counts in
# the anchor census. A "*" in a cell of its own under a header with no "*" column (p.127) is the
# row's asterisk. FY2019's "*" column (header label `star`; read into `review_not_completed`) and
# `side_lists` (p.106).
# Text in the "Fiscal Conduit" column that is not a conduit: fiscal_conduit blank, the printed
# text kept in fiscal_conduit_raw, flagged (REVIEW.md f0d35523ca12 suggests source_error).
conduit_notes = [{ page = 271, printed = "Please indicate the actuals schools.", note = "a drafting note left in the PDF, not a conduit" }]
# FY2019-FY2025 switches with no effect on FY2018 (off): box_title_letters, hrule_beside,
