[structure]
award_header_re = "(Tax ID|EIN).*Amoun"   # p.39 prints "Amoun" | "t" (see header_labels)
summary_title = "Fiscal 2019 Council Initiatives"
summary_titles = [
  # The category summary tables are titled "Fiscal 2019 Council ... Initiatives" (p.12
  # "Fiscal 2019 Council Anti-Poverty Initiatives", p.35 "... Children’s Services ..."), but
  # for two (pp.41, 102).
  "Fiscal 2019 Council", "Fiscal 2019 Criminal Justice Services Initiatives",
  "Fiscal 2019 Small Business Services and Workforce Development Initiatives",
  "Agency | Initiative | Amount",
]
banner_min_size = 19.0     # category banners are 20 pt bold (e.g. p.12 "Anti-Poverty")
statement_prefix = "Designation Method:"
# Each switch below changes FY2019's output when turned off (checked one by one).
# Box + description + statement + award table drawn as one ruled table (e.g. pp.36, 43).
split_merged_tables = true
# A rule between the two lines of a long name (4 rows: pp.64, 73, 75, 90).
continuation_rows = true
# An award table carried over a page without a header (37 rows: pp.45, 93, 123, 127).
headerless_continuation = true
# Tables ruled with horizontal lines only (30 tables, 318 rows; e.g. pp.36, 38, 42, 94).
hrule_tables = true
# From FY2021-FY2026:
# A box title whose first letter is drawn apart, in its own cell (p.62 "E" | "nding the
# Epidemic").
box_title_letters = true
# A fourth column, "Program", between EIN and Amount (pp.93-94, Art as a Catalyst for Change).
hrule_extra_column = true
# Amounts printed with no "$" (FY2026's switch; here every member-table and appendix row).
amount_without_dollar = true
# A name-column-only table, the EINs and amounts printed beside it (p.131, YouthBuild).
hrule_beside = true
# FY2020's: member and appendix tables print every amount with no "$" (p.13 "5,500"); a routine
# flag there (W.amount_bare, 5,092 rows), not a review row.
bare_amounts = true
# FY2020's: orphan characters in a band that went to no segment belong to no table (p.75).
orphans_in_gaps = true
# FY2020's: "Designation Method:" alone, the statement beside it as its own loose line.
statement_beside_label = true
# FY2024's: the award header printed as loose text above an h-rule table (pp.42, 125: "Legal
# Name of Organization", "EIN * Amount"; 21 rows).
loose_header = true
# FY2021's: that loose header ends the statement above it (p.125).
header_band_words = true
# FY2023's and FY2021's: a digit or letter centred in the 8 pt white column at a table's right
# edge goes to the cell its glyph runs into (p.39: "$372,20" | "3"; 3 rows, review items).
sliver_chars = true
edge_slivers = true
# FY2021's: an empty row band drawn above a box's title bar (p.54, Support for Homeless
# Students).
skip_empty_first_row = true
# New for FY2019 (code/schedc/structure.py):
# The label centred between the statement's two loose lines, neither line holding its centre
# (pp.43, 105): every loose line beside the label whose height overlaps it is the statement.
statement_beside_label_span = true
# A box title's last letter drawn apart, in its own cell (p.74 "Foreclosure Buyback Initiativ" |
# "e").
box_title_tail = true
# Also new for FY2019, with no switch: the "*" column (header label `star`, below; read into
# `review_not_completed` and the routine row flag W.asterisk) and `side_lists` (pp.105-106).
# FY2020-FY2025 switches with no effect on FY2019 (off): split_boxes, split_boxes_after_rows,
# split_boxes_award_tables, hrule_header_split, hrule_lead_column, hrule_split_lines,
# hrule_short_ein, header_one_cell, banner_variants, summary_amount_doubled,
# statement_loose_text, statement_in_cell, award_subheadings, summary_amount_without_dollar,
# box_amount_loose, header_overlap_cells, box_amount_dollar_space, box_amount_without_dollar,
# header_two_bands, split_one_cell_rows, total_colon, open_top_rows, box_amount_on_second_row,
# amount_sliver_join, amount_odd_format, header_span_cells, box_amount_cells.
page_furniture_re = "(\\d+|Page \\d+|Fiscal 2019 Adopted Expense Budget Adjustment Summary)"
header_labels = [
  ["Council Member", "member"],
  ["Borough", "delegation"],
  ["Sponsor", "sponsor"],
  ["Legal Name of Organization [-–] Program Name", "org"],     # member and appendix tables
  ["Institute", "org"],                                        # p.68 (CUNY Research Institutes)
  ["Legal Name of Organization", "org"],
  ["EIN", "ein"],
  ["Amount", "amount"],
  ["Agency", "agency"],
  ["CM Purpose of Funds", "purpose"],                          # member and appendix tables (p.13)
  ["\\*", "star"],                                             # p.10: review not complete (p.13)
  ["EIN \\*", "ein"],                                          # an h-rule table's loose header
                                                               # (p.42), no "*" column
  ["Amoun", "amount"],                                         # p.39: the "t" in the 8 pt white
  ["t", "amount_tail"],                                        # column at the right edge (unused)
  ["Program \\*", "program_or_subheading"],                    # pp.93-94, an h-rule table
  ["Program", "program_or_subheading"],                        # pp.93-94 (Art as a Catalyst)
]

# Designation statements (text after "Designation Method:"), checked in order. What FY2019
# prints:
#   - "will designate $N post-adoption and has designated (to) the following provider(s)"
#     (kind `reserve_rows`, rows = box - reserve), also "and the Council has designated" (p.122),
#     or "will designate $N post adoption. The Council has designated" (p.94);
#   - p.58 Food Pantries ("$3.6 million post-adoption and has designated $1 million to the
#     following provider for school pantries"): kind partial;
#   - p.74 "has allocated $195,000 directly to the NYC Department of Housing Preservation and
#     Development, $25,000 directly to the Department of Consumer Affairs, and has designated
#     the following provider" (as FY2020 p.72): the two agency amounts are the part with no rows;
#   - a reserve only, "will designate $N post-adoption." (kind reserve_only);
#   - the whole box later, "will designate post-adoption" or "will designate to service
#     providers post-budget adoption" (p.107): kind reserve_all;
#   - straight to an agency: DOE (pp.53, 54, 58), CUNY (p.77), the Community Boards (p.59), the
#     three library systems (p.84, "Funding is allocated directly to"), three District
#     Attorneys (p.95), CUNY's institutes (p.68), CUNY and DOE (p.68, Vallone): kind direct;
#   - "The Borough Presidents will designate the providers post-adoption." (p.97): reserve_all;
#   - "has designated (to) the following provider(s) for Fiscal 2019", or COMPASS's "has
#     distributed its allocations between the Department of Youth and Community Development and
#     providers, as outlined below" (p.129; DYCD is a row): kind full.
[[statements]]
kind = "reserve_rows"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) (awards )?(post[- ][Aa]doption|after adoption)[.,]? (and )?([Tt]he (City )?Council )?has (designated (to )?the following providers?|made the following designations) (for|in) Fiscal 2019 ?[:.]?$"
[[statements]]
kind = "reserve_rows"
re = "^The (City )?(Council )?has designated (to )?the following providers? for Fiscal 2019 and will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ](budget )?[Aa]doptions? ?[.:]$"
[[statements]]
kind = "reserve_rows"
re = "^The (City )?Council has allocated \\$(?P<reserve>[\\d,]+) directly to the NYC Department of Housing Preservation and Development, \\$(?P<reserve2>[\\d,]+) directly to the Department of Consumer Affairs, and has designated the following provider for Fiscal 2019:$"
[[statements]]
kind = "partial"
re = "^The City Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post-adoption and has designated \\$(?P<designated>[\\d,]+|\\d+(\\.\\d+)? million) to the following provider for school pantries for Fiscal 2019:$"
[[statements]]
kind = "reserve_only"
re = "^The (City )?(Council )?will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ]adoption ?[.:]?$"
[[statements]]
kind = "reserve_all"
re = "^(The (City )?Council will designate (awards |this funding |to service providers )?|This initiative will be designated )(post[- ](budget )?adoption|after adoption)( for Fiscal 2019)? ?[.:]?$"
[[statements]]
kind = "direct"
re = "^(This f|F)unding is (directly allocated|allocated directly) to the (Brooklyn Public Library|New York Public Library|Queens Borough Public Library|Research Library)\\.$"
[[statements]]
kind = "direct"
re = "^This funding is allocated directly to (the )?(City University of New York|CUNY|NYC Department of Education|Department of Education|Department for the Aging)( for the following institutes)?[.:]$"
[[statements]]
kind = "direct"
re = "^The City Council has allocated \\$[\\d,]+ directly to the City University of New York and \\$[\\d,]+ directly to the Department of Education\\.$"
[[statements]]
kind = "reserve_all"
re = "^The Borough Presidents will designate the providers post-adoption\\.$"
[[statements]]
kind = "direct"
re = "^This funding is allocated directly to the Community Boards( and each is designated \\$[\\d,]+)?\\.$"
[[statements]]
kind = "direct"
re = "^This funding is allocated directly to the Kings County, Queens County, and Richmond County District Attorneys\\.$"
[[statements]]
kind = "full"
re = "^The City Council has distributed its allocations between the Department of Youth and Community Development and providers, as outlined below:$"
[[statements]]
kind = "full"
re = "^The (City )?(Council )?has designated (to )?(the )?following providers? (for|in) Fiscal 2019 ?[:.]$"

