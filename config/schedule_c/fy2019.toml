# FY2019 Schedule C: every year-specific fact the pipeline needs, and nothing else (PLAN §7).
# Each value cites the page it was read from. Shared code lives in code/schedc/.

fiscal_year = 2019
pdf = "source/FY19/Fiscal-2019-Schedule-C-Final-Report.pdf"
sha256 = "dd6e75fa70236eb0c535df270850b968889c017f111c8b3accb2fe4aa6d38910"
pages = 357
x_tolerance = 3.0          # pdfplumber default; FY2019 text has real space glyphs (PLAN §2.2)
review_dir = "research/2026-10-22-fy19-schedule-c-review"   # outputs land in <review_dir>/data
# Disclosure (report only): data/fy19/expense_disclosure. There was no 2026-10-19 prototype for
# FY2019, so no H17 floor (0).
disclosure_note = "as committed in data/fy19/expense_disclosure"
h17_floor = 0

# The 27 categories, as printed on each category banner (20 pt bold, pp.12-128), the same 27 as
# FY2020.
categories = [
  "Anti-Poverty", "Boroughwide Needs", "Children’s Services", "Community Development",
  "Criminal Justice Services", "Cultural Organizations", "Domestic Violence Services",
  "Education", "Environmental Initiatives", "Food Initiatives", "Government Officials",
  "Health Services", "Higher Education Initiatives", "Homeless Services", "Housing",
  "Immigrant Services", "Legal Services", "Libraries", "Mental Health Services",
  "Parks and Recreation Services", "Public Safety", "Senior Services",
  "Small Business Services and Workforce Development",
  "Speaker’s Initiative to Address Citywide Needs", "Veteran Services",
  "Young Women’s Initiative", "Youth Services",
]

