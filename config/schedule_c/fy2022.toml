# Designation statements (text after "Designation Method:"), checked in order. FY2022 words
# them 74 ways (138 statements, 141 boxes). What FY2022 does:
#   - "will designate $N post-adoption and has designated the following providers" (kind
#     `reserve_rows`, as FY2024: rows = box - reserve), also "post adoption", "after
#     adoption", "post-Adoption", "in Fiscal 2022"; or the other way round, "has designated the
#     following providers for Fiscal 2022 and will designate $N post-adoption." (e.g. pp.33-39,
#     63, 73, 119), "post budget adoption" and "post Adoption" (pp.112-113), "has designated to
#     the following providers" (p.92), and once "The has designated" (p.113, a word missing);
#   - "$3,462,000 million" (p.37), read as $3,462,000 (a review row);
#   - "has allocated $195,000 directly to the NYC Department of Housing Preservation and
#     Development, $25,000 directly to the Department of Consumer Affairs, and has designated
#     the following provider" (p.65): the two agency amounts are the part with no rows
#     (`reserve...` groups add up, code/schedc/structure.py `statement_kind`);
#   - "has designated $100,000 to the following provider for Fiscal 2022 and $100,000 will be
#     allocated to DYCD and will be designated post-budget adoption" (p.112) and p.51 Food
#     Pantries ("$18.159 million post-adoption ... has designated $1 million"): kind partial;
#   - a reserve only, no rows, e.g. "The Council will designate $4 million post-adoption."
#     (p.32): kind reserve_only;
#   - the whole box later, "will designate (awards / this funding) post-adoption" with or
#     without a final "." (pp.92-96 print none): kind reserve_all;
#   - straight to an agency: CUNY (pp.60-61), DOE (p.117), the four library systems (pp.75-76):
#     kind direct;
#   - "the following provider(s)" with "has designated" (51 boxes; "has designated following
#     providers", p.115, no "the"): kind full.
[[statements]]
kind = "reserve_rows"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) (awards )?(post[- ][Aa]doption|after adoption)\\.? (and )?has (designated the following providers?|made the following designations) (for|in) Fiscal 2022 ?[:.]$"
[[statements]]
kind = "reserve_rows"
re = "^The (City )?(Council )?has designated (to )?the following providers? for Fiscal 2022 and will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ](budget )?[Aa]doption ?[.:]$"
[[statements]]
kind = "reserve_rows"
re = "^The City Council has designated the following providers for Fiscal 2022 and will designate \\$(?P<reserve>[\\d,]+) million post-adoption:$"
[[statements]]
kind = "reserve_rows"
re = "^The City Council has allocated \\$(?P<reserve>[\\d,]+) directly to the NYC Department of Housing Preservation and Development, \\$(?P<reserve2>[\\d,]+) directly to the Department of Consumer Affairs, and has designated the following provider for Fiscal 2022:$"
[[statements]]
kind = "partial"
re = "^The City Council has designated \\$(?P<designated>[\\d,]+) to the following provider for Fiscal 2022 and \\$(?P<reserve>[\\d,]+) will be allocated to DYCD and will be designated post-budget adoption:$"
[[statements]]
kind = "partial"
re = "^The City Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post-adoption to community-based food organizations and has designated \\$(?P<designated>[\\d,]+|\\d+(\\.\\d+)? million) to the following provider for school pantries for Fiscal 2022:$"
[[statements]]
kind = "reserve_only"
re = "^The (City )?(Council )?will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ]adoption ?[.:]?$"
[[statements]]
kind = "reserve_all"
re = "^The (City )?Council will designate (awards |this funding )?(post[- ]adoption|after adoption)( for Fiscal 2022)? ?[.:]?$"
[[statements]]
kind = "direct"
re = "^This funding is directly allocated to the (Brooklyn Public Library|New York Public Library|Queens Borough Public Library|Research Library)\\.$"
[[statements]]
kind = "direct"
re = "^This funding is allocated directly to the (City University of New York|NYC Department of Education)( for the following institutes)?\\.$"
[[statements]]
kind = "direct"
re = "^The City Council has allocated \\$[\\d,]+ directly to the City University of New York and \\$[\\d,]+ directly to the Department of Education\\.$"
[[statements]]
kind = "full"
re = "^The (City )?(Council )?has designated (the )?following providers? (for|in) Fiscal 2022 ?[:.]$"

# Image lattice and ink: FY2023's values.
#   - carry_header: the image side reads a table with no header (p.85) with the last header it
#     saw, as FY2024.
#   - band_check: rows the image lattice cannot see (the h-rule tables) are checked against the
#     pixels' horizontal rules (code/schedc_cv/imagegrid.py `check_bands`), as FY2024.
#   - ink_min_region_px 32, as FY2023: the self-test row's 'i' fires at 32; the clean run finds
#     0 regions.
