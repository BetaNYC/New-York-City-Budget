# Designation statements (text after "Designation Method:"), checked in order. FY2024 words
# them 71 ways (144 statements). What FY2024 does that FY2025 does not:
#   - "will designate $N post-adoption and has designated the following providers": a reserve
#     and rows, but no designated amount (31 boxes, e.g. pp.48, 67, 69). Kind `reserve_rows`
#     (code/schedc/reconcile.py): rows = box - reserve. Worded also "post adoption", "after
#     adoption", "post-Adoption", "$N awards post-adoption" (p.40), "$N in awards
#     post-adoption" (pp.125, 126), as two sentences ("will designate $N post adoption The
#     City Council has designated ...", pp.176-183), or the other way round ("has designated
#     the following providers for Fiscal 2024 and will designate $N post-adoption", p.63);
#   - p.147 Food Pantries: "has designated $N to Food Bank for New York City for school
#     pantries, $N to two community-based food organizations, and will designate $N
#     post-adoption ...": the two designated amounts add up;
#   - "will designate post adoption." with no amount (pp.108, 182, 265): kind reserve_all;
#   - "This funding is allocated directly to the City University of New York" (pp.156-157),
#     "The City Council has allocated $N directly to the City University of New York and $N
#     directly to the Department of Education" (p.158), "The funding is allocated directly to
#     the NYC Department of Education" (p.260): kind direct;
#   - other wordings of "the following providers": "has made the following designations"
#     (p.37), "will designate the following providers" (p.66), "The City will designate"
#     (p.66), "in Fiscal 2024" (pp.153, 154), no year (p.256), "Fiscal 2023" (p.168, a typo);
#   - amounts in millions, "$2.48 million" (p.69), "$1 million" (p.147), read at face value;
#   - Libraries (p.174) as FY2025: "This funding is directly allocated to the ... Library.";
#   - p.262 prints two statements in one ("has designated the following provider for Fiscal
#     2024. The City Council will designate $N post-adoption and has designated ...").
# A loose column header printed under a statement ("Legal Name of Organization", e.g. p.148)
# is read into it by the line-joining rule; the patterns allow it at the end.
[[statements]]
kind = "reserve_rows"
re = "^(The (City )?Council has designated the following providers? for Fiscal 2024\\. )?The (City )?Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) (in )?(awards )?(post[- ][Aa]doption|after adoption)( and|\\. The City Council)? (has|have) designated the following providers? (for|in) Fiscal 2024 ?[:.]( Legal Name of Organization)?$"
[[statements]]
kind = "reserve_rows"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+) post adoption The City Council has designated the following providers? for Fiscal 2024 ?[:.]$"
[[statements]]
kind = "reserve_rows"
re = "^The City Council has designated the following providers for Fiscal 2024 and will designate \\$(?P<reserve>[\\d,]+) post-adoption:$"
[[statements]]
kind = "partial"
re = "^The City Council has designated \\$(?P<designated>[\\d,]+|\\d+(\\.\\d+)? million) to Food Bank for New York City for school pantries, \\$(?P<designated2>[\\d,]+) to two community-based food organizations, and will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post-adoption to additional community-based food organizations for Fiscal 2024:$"
[[statements]]
kind = "reserve_only"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+) post[- ]adoption( for Fiscal 2024)? ?[.:]$"
[[statements]]
kind = "direct"
re = "^This funding is directly allocated to the (Brooklyn Public Library|New York Public Library|Queens Borough Public Library|Research Library)\\.$"
[[statements]]
kind = "reserve_all"
re = "^The (City )?Council will designate (awards )?post[- ]adoption ?[.:]$"
[[statements]]
kind = "direct"
re = "^Th(is|e) funding is allocated directly to the (City University of New York|NYC Department of Education)( for the following institutes| for Fiscal 2024)?[.:]$"
[[statements]]
kind = "direct"
re = "^The City Council has allocated \\$[\\d,]+ directly to the City University of New York and \\$[\\d,]+ directly to the Department of Education\\.$"
[[statements]]
kind = "full"
re = "^The (City )?(Council )?(h ?as designated|has made|will designate) the following (providers?|designations)( (for|in) Fiscal 202[34])? ?[:.]( Legal Name of Organization)?$"

# Image lattice and ink: FY2027's values, with three FY2024 changes.
#   - carry_header: the image side reads a table with no header (or its header at the bottom,
#     pp.41-45) with the last header it saw, as FY2026.
#   - band_check: rows the image lattice cannot see (tables with no drawn vertical rules: the
#     h-rule tables, and tables whose only verticals are white-filled boxes, e.g. p.178) are
#     checked against the pixels' horizontal rules (code/schedc_cv/imagegrid.py `check_bands`).
#   - ink_min_region_px 48, not 64: the Speaker's pages (pp.227-254) are set in 8.8 pt type,
#     where a letter 'i' is 61 px at 300 dpi. At 48 the clean run still finds 0 regions (1,736
#     loose px of 274,459,445 ink px) and the self-test's 'i' fires.
# Pixels and pdfplumber coordinates are both taken from the MediaBox corner: 216 pages
# (pp.227-254, 266-453) have MediaBox [-18.03 17.97 773.97 629.97] (code/schedc/vector.py
# `origin`).
[image]
dpi = 300
kernel_px = 60
region_pad_px = 8
row_tol_pt = 1.0
carry_header = true
band_check = true
char_pad_px = 1
rule_pad_px = 1
ink_cell_px = 16
ink_min_region_px = 48
# Acceptance: Medicare Rights Center, Inc. $100,000 (p.242), a row the data on main lacks, on a
