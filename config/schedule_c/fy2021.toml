  "Fiscal 2021 Criminal Justice Services Initiatives",
  "Fiscal 2021 Council Cultural Organization Initiatives",
  "Fiscal 2021 Council Domestic Violence Services Initiatives", "Fiscal 2021 Food Initiatives",
  "Fiscal 2021 Health Services Initiatives", "Fiscal 2021 Higher Education Initiatives",
  "Fiscal 2021 Council Homeless Initiatives", "Fiscal 2021 Housing Initiatives",
  "Fiscal 2021 Council Legal Services Initiatives", "Fiscal 2021 Council Libraries Initiatives",
  "Fiscal 2021 Mental Health Services Initiatives",
  "Fiscal 2021 Council Senior Services Initiatives",
  "Fiscal 2021 Small Business Services and Workforce Development Initiatives",
  "Fiscal 2021 Veteran Services Initiatives", "Fiscal 2020 Young Women’s Initiatives",
  "Fiscal 2021 Youth Services Initiatives",
  "Agency | Initiative | Amount",
]
banner_min_size = 13.5     # category banners are 14 pt bold (e.g. p.11 "Anti-Poverty")
statement_prefix = "Designation Method:"
# Each switch below changes FY2021's output when turned off (checked one by one).
# Box + description + statement + award table drawn as one ruled table (e.g. pp.35, 40, 98).
split_merged_tables = true
# A rule between the two lines of a long name (38 rows; e.g. pp.35, 99, 101-102).
continuation_rows = true
# An award table carried over a page without a header (e.g. pp.36, 71, 72).
headerless_continuation = true
# A table ruled with horizontal lines only (p.94, the Art as a Catalyst for Change rows).
hrule_tables = true
# A second box in the same ruled table, under the first box's statement or award rows (e.g.
# p.48, three SAVE boxes).
split_boxes = true
split_boxes_after_rows = true
# From FY2022-FY2025:
# The award header printed as loose text just above the table (511 rows, e.g. pp.56, 60, 63).
loose_header = true
# "Designation Method:" alone in a cell, its text beside it outside the cells.
statement_loose_text = true
# Box titles whose first letter is drawn apart (p.105 "C" | "reate New Technology Incubators").
box_title_letters = true
# A letter in a narrow phantom column left of its text cell (9 rows, p.105).
sliver_chars = true
# A fourth column, "Program", between EIN and Amount (pp.93-94, Art as a Catalyst for Change,
# as FY2022 pp.84-85). Read into `program_or_subheading` (#209), not `purpose`.
hrule_extra_column = true
# The statement starts on a later line of a description cell (p.60, HIV/AIDS Faith-Based).
statement_in_cell = true
# New for FY2021 (code/schedc/structure.py, vector.py):
# The award header printed partly or wholly outside the table's rules, in its first row band or
# right under the statement (81 rows; p.35 "Amount" beside "Legal Name of Organization | EIN";
# p.45 "EIN" in a cell, the other two loose; p.40 loose under the statement). The statement
# ends at it; the loose words complete the header.
header_band_words = true
# Sub-headings printed as rows of an award table (pp.70-72, Community Housing Preservation
# Strategies: "Technical Assistance", "Community Consultant Contracts", "Housing Preservation
# Initiative"; the first printed above the header). Not award rows; the rows under each carry
# it in `program_or_subheading` (67 rows, flagged; #209), not `purpose`.
award_subheadings = ["Technical Assistance", "Community Consultant Contracts", "Housing Preservation Initiative"]
# The white column down a table's left and right edge is 8.9 pt wide, the first letter and the
# last digit of each row centred in it (pp.105-106).
edge_slivers = true
# A summary TOTAL printed without "$" (p.49, Education "21,679,075").
summary_amount_without_dollar = true
# A box drawn narrower than its title bar, its amount printed beside it (p.98, NORCs
# "$5,400,325").
box_amount_loose = true
# A box with an empty row band above its title bar (p.84, Queens Borough Public Library).
skip_empty_first_row = true
# A data row whose cell borders do not line up with its header's (p.73, Foreclosure Prevention
# Programs: the header's EIN cell centre falls in an empty 5 pt cell of the rows).
header_overlap_cells = true
# A box amount printed malformed, read as named (critical review item, not corrected).
box_amount_read = [
  {page = 122, initiative = "Initiative for Immigrant Survivors of Domestic Violence", printed = "$477,00", amount = 477000, note = "PDF prints '$477,00' (one zero short); its summary line (p.122) prints $477,000, and $81,000 post-adoption plus the rows make $477,000"},
]
