# box_amount_without_dollar, split_boxes_award_tables, hrule_beside, hrule_header_split,
# header_two_bands, split_one_cell_rows, total_colon, open_top_rows, box_amount_on_second_row,
# amount_without_dollar, amount_sliver_join, amount_odd_format, header_span_cells,
# box_amount_cells.
page_furniture_re = "(\\d+|Page \\d+|FISCAL 2021 ADOPTED EXPENSE BUDGET ADJUSTMENT SUMMARY)"
