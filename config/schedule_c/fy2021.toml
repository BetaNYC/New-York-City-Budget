  ["Council Member", "member"],
  ["Borough", "delegation"],                                  # pp.27-32 Boroughwide Needs
  ["Sponsor", "sponsor"],                                     # pp.111-118 Speaker's
  ["Legal Name of Organization [-–] Program Name", "org"],
  ["Institute", "org"],
  ["Legal Name", "org"],
  ["Legal Name of Organization", "org"],                      # e.g. p.33
  ["Tax ID", "ein"],
  ["EIN", "ein"],
  ["Amount", "amount"],
  ["Agency", "agency"],
  ["Purpose of Funds", "purpose"],
  ["Program", "program_or_subheading"],                       # pp.93-94 (see above)
]

# Designation statements (text after "Designation Method:"), checked in order. What FY2021
# does:
#   - "will designate $N post-adoption and has designated the following providers" (kind
#     `reserve_rows`, rows = box - reserve), also with ", and the City Council has designated"
#     (p.120), or the other way round, "has designated the following providers for Fiscal 2021
#     and will designate $N post-adoption" (e.g. p.33; "post-adoptions", p.61); with or
#     without a final ":" (p.44 prints none);
#   - "The Council will designate $N post-adoption. The Council has designated $M for (the)
#     following providers" (p.81, twice): kind partial;
#   - p.55 Food Pantries ("$4.6 million post-adoption ... has designated $1 million"): partial;
#   - p.72 "has allocated $165,750 directly to the NYC Department of Housing Preservation and
#     Development, $21,250 directly to the Department of Consumer Affairs, and has designated
#     the following provider" (as FY2022 p.65): the two agency amounts are the part with no rows;
#   - a reserve only, "will designate $N post-adoption." (kind reserve_only);
#   - the whole box later, "will designate post-adoption" or "This initiative will be
#     designated post-adoption" (p.106, no final "."): kind reserve_all;
#   - straight to an agency: CUNY (pp.67-68), DOE (p.124), DFTA (p.96), the four library
#     systems (p.83): kind direct;
#   - "has designated (to) the following provider(s) for/in Fiscal 2021": kind full.
[[statements]]
kind = "reserve_rows"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) (awards )?(post[- ][Aa]doption|after adoption)\\.?,? (and )?(the City Council )?has (designated the following providers?|made the following designations) (for|in) Fiscal 2021 ?[:.]?$"
[[statements]]
kind = "reserve_rows"
re = "^The (City )?(Council )?has designated (to )?the following providers? for Fiscal 2021 and will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ](budget )?[Aa]doptions? ?[.:]$"
[[statements]]
kind = "reserve_rows"
re = "^The City Council has allocated \\$(?P<reserve>[\\d,]+) directly to the NYC Department of Housing Preservation and Development, \\$(?P<reserve2>[\\d,]+) directly to the Department of Consumer Affairs, and has designated the following provider for Fiscal 2021:$"
[[statements]]
kind = "partial"
re = "^The Council will designate \\$(?P<reserve>[\\d,]+) post-adoption\\. The Council has designated \\$(?P<designated>[\\d,]+) for (the )?following providers for Fiscal 2021:$"
[[statements]]
kind = "partial"
re = "^The City Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post-adoption to community-based food organizations and has designated \\$(?P<designated>[\\d,]+|\\d+(\\.\\d+)? million) to the following provider for school pantries for Fiscal 2021:$"
[[statements]]
kind = "reserve_only"
re = "^The (City )?(Council )?will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ]adoption ?[.:]?$"
[[statements]]
kind = "reserve_all"
re = "^(The (City )?Council will designate (awards |this funding )?|This initiative will be designated )(post[- ]adoption|after adoption)( for Fiscal 2021)? ?[.:]?$"
[[statements]]
kind = "direct"
re = "^This funding is directly allocated to the (Brooklyn Public Library|New York Public Library|Queens Borough Public Library|Research Library)\\.$"
[[statements]]
kind = "direct"
re = "^This funding is allocated directly to the (City University of New York|NYC Department of Education|Department for the Aging)( for the following institutes)?\\.$"
[[statements]]
kind = "direct"
re = "^The City Council has allocated \\$[\\d,]+ directly to the City University of New York and \\$[\\d,]+ directly to the Department of Education\\.$"
[[statements]]
kind = "full"
re = "^The (City )?(Council )?has designated (to )?(the )?following providers? (for|in) Fiscal 2021 ?[:.]$"

