# FY2021 Schedule C: every year-specific fact the pipeline needs, and nothing else (PLAN §7).
# Each value cites the page it was read from. Shared code lives in code/schedc/.

fiscal_year = 2021
pdf = "source/FY21/Fiscal-2021-Schedule-C-Cover-REPORT-Final.pdf"
sha256 = "3323ceaefa437b775711bacadc8c8645a89759dfe198b72d0bdd569da9271f0a"
pages = 343
x_tolerance = 3.0          # pdfplumber default; FY2021 text has real space glyphs (PLAN §2.2)
review_dir = "research/2026-10-22-fy21-schedule-c-review"   # outputs land in <review_dir>/data
# Disclosure (report only): data/fy21/expense_disclosure. There was no 2026-10-19 prototype for
# FY2021, so no H17 floor (0).
disclosure_note = "as committed in data/fy21/expense_disclosure"
h17_floor = 0

# The 26 categories, as printed on each category banner (14 pt bold, pp.11-126). FY2021 has
# "Children's Services" (p.33), no "Community Safety and Victim Services", and its banners read
# "Senior Services" (p.96) and "Veteran Services" (p.119).
categories = [
  "Anti-Poverty", "Boroughwide Needs", "Children’s Services", "Community Development",
  "Criminal Justice Services", "Cultural Organizations", "Domestic Violence Services",
  "Education", "Environmental Initiatives", "Food Initiatives", "Health Services",
  "Higher Education Initiatives", "Homeless Services", "Housing", "Immigrant Services",
  "Legal Services", "Libraries", "Mental Health Services", "Parks and Recreation Services",
  "Public Safety", "Senior Services", "Small Business Services and Workforce Development",
  "Speaker’s Initiative to Address Citywide Needs", "Veteran Services",
  "Young Women’s Initiative", "Youth Services",
]

