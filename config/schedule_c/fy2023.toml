# Designation statements (text after "Designation Method:"), checked in order. FY2023 words
# them 62 ways (142 statements, 145 boxes). What FY2023 does:
#   - "will designate $N post-adoption and has designated the following providers": a reserve
#     and rows, but no designated amount (kind `reserve_rows`, as FY2024: rows = box -
#     reserve). Worded also "post adoption", "post-Adoption", "after adoption", "$N awards
#     post-adoption" (pp.35, 38), "post adoption. and has" (p.39), "post-adoption has
#     designated" (p.99, no "and"), "has made the following designations" (p.35), "in Fiscal
#     2023" (p.62); or the other way round: "has designated the following providers for Fiscal
#     2023 and $N will be designated post-adoption." (pp.71-75), "... post budget adoption:"
#     and "post-budget adoption:" (pp.131-132), "... and will designate $N post-adoption:"
#     (pp.43, 82, 83), and once with "The has designated" (p.132, a word missing);
#   - "has designated $N to the following provider for Fiscal 2023 and $N will be designated
#     post-budget adoption:" (p.131): kind partial;
#   - p.59 Food Pantries: "will designate $6.6 million post-adoption to community- based food
#     organizations and has designated $1 million to the following provider for school
#     pantries": kind partial;
#   - a reserve only, no rows: "will designate $1.2 million post-adoption" (p.44), "$14.5
#     million post-adoption." (p.42), "The City will designate $4.4 million post-adoption:"
#     (p.44), "The Council Members will designate $100,000 per Council District, for a total of
#     $5,100,000 post adoption." (p.41);
#   - the whole box later: "will designate post-adoption." and "awards / providers / this
#     funding post-adoption / after adoption", "for Fiscal 2023:" (p.94), "This initiative
#     will be designated post-Adoption." (p.102): kind reserve_all;
#   - straight to an agency: CUNY (pp.67-69), "has allocated $15,753,469 directly to the City
#     University of New York and $658,400 directly to the Department of Education" (p.67),
#     DOE (p.136), the four library systems (pp.84-85): kind direct;
#   - "the following providers" with "designated" and no "has" (p.140), "has designated
#     following providers" (p.134, no "the"), and "for Fiscal 2022" (pp.49-50, a typo kept as
#     printed): kind full.
[[statements]]
kind = "reserve_rows"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) (awards )?(post[- ][Aa]doption|after adoption)\\.? (and )?has (designated the following providers?|made the following designations) (for|in) Fiscal 2023 ?[:.]$"
[[statements]]
kind = "reserve_rows"
re = "^The (City )?(Council )?has designated the following providers for Fiscal 2023 and \\$(?P<reserve>[\\d,]+) will be designated post[- ](budget )?adoption ?[.:]$"
[[statements]]
kind = "reserve_rows"
re = "^The City Council has designated the following providers for Fiscal 2023 and will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post-adoption:$"
[[statements]]
kind = "partial"
re = "^The City Council has designated \\$(?P<designated>[\\d,]+) to the following provider for Fiscal 2023 and \\$(?P<reserve>[\\d,]+) will be designated post-budget adoption:$"
[[statements]]
kind = "partial"
re = "^The City Council will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post-adoption to community- based food organizations and has designated \\$(?P<designated>[\\d,]+|\\d+(\\.\\d+)? million) to the following provider for school pantries for Fiscal 2023:$"
[[statements]]
kind = "reserve_only"
re = "^The (City )?(Council )?(Members )?will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post[- ]adoption ?[.:]?$"
[[statements]]
kind = "reserve_only"
re = "^The Council Members will designate \\$100,000 per Council District, for a total of \\$(?P<reserve>[\\d,]+) post adoption\\.$"
[[statements]]
kind = "reserve_all"
re = "^The (City )?Council will designate (awards |providers |this funding )?(post[- ]adoption|after adoption)( for Fiscal 2023)? ?[.:]$"
[[statements]]
kind = "reserve_all"
re = "^This initiative will be designated post-Adoption\\.$"
[[statements]]
kind = "direct"
re = "^This funding is directly allocated to the (Brooklyn Public Library|New York Public Library|Queens Borough Public Library|Research Library)\\.$"
[[statements]]
kind = "direct"
re = "^This funding is allocated directly to the (City University of New York|NYC Department of Education)( for the following institutes)?\\.$"
[[statements]]
kind = "direct"
re = "^The City Council has allocated \\$[\\d,]+ directly to the City University of New York and \\$[\\d,]+ directly to the Department of Education\\.$"
[[statements]]
kind = "full"
re = "^The (City )?(Council )?(h ?as designated|has made|will designate|designated) (the )?following (providers?|designations)( (for|in) Fiscal 202[23])? ?[:.]( Legal Name of Organization)?$"

# Image lattice and ink: FY2024's values, except the ink region floor.
#   - carry_header: the image side reads a table with no header (every Appendix C page after
#     p.294) with the last header it saw, as FY2024.
#   - band_check: rows the image lattice cannot see (the h-rule tables) are checked against the
#     pixels' horizontal rules (code/schedc_cv/imagegrid.py `check_bands`), as FY2024.
#   - ink_min_region_px 32, not 48: the self-test row (p.235, 10 pt Calibri) has an 'i' under
#     40 px at 300 dpi. At 32 the clean run still finds only one region, the real one: p.98's
#     "I" before it was read into its row (`sliver_chars`).
# No page has a MediaBox offset (every MediaBox starts at (0, 0)).
[image]
dpi = 300
kernel_px = 60
region_pad_px = 8
row_tol_pt = 1.0
carry_header = true
band_check = true
char_pad_px = 1
rule_pad_px = 1
ink_cell_px = 16
ink_min_region_px = 32
