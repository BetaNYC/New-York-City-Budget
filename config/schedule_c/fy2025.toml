# FY2025 Schedule C: every year-specific fact the pipeline needs, and nothing else (PLAN §7).
# Each value cites the page it was read from. Shared code lives in code/schedc/.

fiscal_year = 2025
pdf = "source/FY25/Fiscal-2025-Schedule-C-MERGE-FINAL-2.pdf"
sha256 = "71b7dfc2a96aab412275da3c519e3faf913d654fd252b880c75738b0c6a2c196"
pages = 455
x_tolerance = 3.0          # pdfplumber default; FY2025 text has real space glyphs (PLAN §2.2)
review_dir = "research/2026-10-21-fy25-schedule-c-review"   # outputs land in <review_dir>/data
# Disclosure (report only): data/fy25/expense_disclosure, parsed from the workbook's sheet
# 'FY25 (09-14-26)'. H17 floor: the 2026-10-19 prototype matched 9,386 rows (PLAN §2.3). This
# build matches 9,385: the one less is Safe Horizon's $150,000 (p.181), whose EIN is printed
# "13-294-6970" and is left blank here (named exception below).
disclosure_note = "workbook sheet 'FY25 (09-14-26)'"
h17_floor = 9386

# The 26 categories, as printed on each category banner (20 pt bold). The ToC (p.3) prints them
# in capitals and says "CULTURAL ORGANIZATION"; the banners are the record. FY2025 has two
# categories FY2026 does not (Libraries p.174, Mental Health p.176, not "Mental Health
# Services") and says "Cultural Organization", not "Cultural Organizations".
categories = [
  "Anti-Poverty", "Boroughwide Needs", "Community Development",
  "Community Safety and Victim Services", "Criminal Justice Services", "Cultural Organization",
  "Domestic Violence", "Education", "Environmental Initiatives", "Food Initiatives",
  "Health Services", "Higher Education Initiatives", "Homeless Services", "Housing",
  "Immigrant Services", "Legal Services", "Libraries", "Mental Health", "Older Adult Services",
  "Parks and Recreation Services", "Public Safety",
  "Small Business Services and Workforce Development",
  "Speaker’s Initiative to Address Citywide Needs", "Veteran Services",
  "Young Women’s Initiative", "Youth Services",
]

# Section page ranges, read from the pages (Appendix titles first printed on pp.268, 294, 413;
# first category banner p.10).
[[page_ranges]]
name = "front"
first = 1
last = 9
[[page_ranges]]
name = "body"
first = 10
last = 267
[[page_ranges]]
name = "appendix_a"
first = 268
last = 293
[[page_ranges]]
name = "appendix_b"
