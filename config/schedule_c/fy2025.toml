[structure]
award_header_re = "(Tax ID|EIN).*Amount"
summary_title = "Fiscal 2025 Council Initiatives"
# FY2025 titles its category summary tables 17 ways (pp.10-264); Criminal Justice Services
# (p.59) prints the table with no title row, starting at its column header; Parks and
# Recreation Services (p.202) prints no summary table at all (`no_summary`, below).
summary_titles = [
  "Fiscal 2025 Council Initiatives", "Fiscal 2025 Community Development Initiatives",
  "Fiscal 2025 Council Cultural Organization Initiatives",
  "Fiscal 2025 Council Domestic Violence Services Initiatives", "Fiscal 2025 Food Initiatives",
  "Fiscal 2025 Health Services Initiatives", "Fiscal 2025 Higher Education Initiatives",
  "Fiscal 2025 Council Homeless Initiatives", "Fiscal 2025 Initiatives",
  "Fiscal 2025 Immigrant Services Initiatives", "Fiscal 2025 Council Legal Services Initiatives",
  "Fiscal 2025 Council Libraries Initiatives", "Fiscal 2025 Mental Health Services",
  "Fiscal 2025 Council Older Adult Services Initiatives",
  "Fiscal 2025 Small Business Services and Workforce Development Initiatives",
  "Fiscal 2025 Veteran Services Initiatives", "Fiscal 2025 Young Women’s Initiatives",
  "Fiscal 2025 Youth and Community Development Initiatives",
  "Agency | Initiative | Amount",
]
banner_min_size = 19.0     # category banners are 20 pt bold (e.g. p.10 "Anti-Poverty")
statement_prefix = "Designation Method:"
# FY2026's switches that FY2025 also needs (each one changes the output when turned off):
box_amount_on_second_row = true   # p.150: "HIV/AIDS Faith and Community Based Initiative
                                  # (formerly ...)" wraps, its amount on the second line
# Box + description + statement + award table drawn as one ruled table (e.g. pp.35, 156, 168).
split_merged_tables = true
# A rule between the two lines of a long name (16 rows, e.g. p.117 "...Washington Heights and"
# / "Inwood", p.211 "...Madiba Prep School" / "(MS681)").
continuation_rows = true
# Not needed in FY2025 (no output change when on): amount_without_dollar,
# headerless_continuation (no award table carries over a page without its header).
# pp.131-144 print "Council" and "Member" in two row bands with a rule between them.
header_two_bands = true
# Box titles whose first letter is drawn apart: its own cell (p.149 "E" | "nding the Epidemic",
# p.258 "V" | "eteran Resource Centers", "V" | "eterans Community Development"), or left of the
# table's left rule (p.36 "D" + "igital Inclusion and Literacy Initiative").
box_title_letters = true
# An amount's last digit(s) drawn past the rule that ends its cell: into a narrow phantom
# column (p.222 Pride at Work, 5 rows "$200,00" | "0") or beyond the table's right rule (p.260
# box "HRA Teen RAPP $250,00" + "0"). The page shows "$200,000" and "$250,000".
amount_sliver_join = true
# Amounts printed with zero cents (p.168 "$77,000.00") or a trailing period (p.170 "$50,000.").
amount_odd_format = true
# A data row cut into more cells than its header (p.183, 2 rows): the name sits in a cell left
# of the header's centre.
header_span_cells = true
# A second initiative box inside the same ruled table, under the first box's statement (p.35
# "Adult Literacy Pilot Project | $2,500,000").
split_boxes = true
# A box amount cut into cells by phantom column rules (p.157 "$" | "5" | "00,000").
box_amount_cells = true
# A designation statement printed inside a description cell, after "Scope of Service" (p.168
# Legal Services for Low-Income Immigrants).
statement_in_cell = true
page_furniture_re = "(\\d+|Page \\d+|FISCAL YEAR 2025 ADOPTED EXPENSE BUDGET ADJUSTMENT SUMMARY)"
header_labels = [
  ["Council Member", "member"],
  ["Sponsor", "sponsor"],
  ["Legal Name of Organization [-–] Program Name", "org"],
  ["Legal Name of the Organization – Program Name", "org"],   # pp.167-169
  ["Legal Name of Organization - Program", "org"],            # p.261 (printed cut short)
  ["Institute", "org"],                                       # p.156 CUNY Research Institutes
  ["Legal Name", "org"],                                      # pp.158, 173, 181
  ["Tax ID", "ein"],
  ["EIN", "ein"],
  ["Amount", "amount"],
  ["Agency", "agency"],
  ["Purpose of Funds", "purpose"],
]

# Designation statements (text after "Designation Method:"), checked in order. FY2025 words
# them 30 ways; each pattern names the pages it was written from. New in FY2025:
#   - amounts in millions, "$4.1 million" (9 boxes, pp.36-222), read at face
#     value by code/schedc/structure.py `statement_amount`;
#   - "to the following organizations" (p.146), "in Fiscal 2025" (pp.149-153), no fiscal year
#     at all (pp.62, 222), a "." where others print ":" (pp.189, 202);
#   - two typos kept as printed: "The City Council for Fiscal 2025 and will designate" (p.60)
#     and "has designated and has designated" (p.129);
#   - Libraries (p.174): "This funding is directly allocated to the <library>." (kind direct:
#     no rows; the box is a direct pot).
# The text layer splits "h as" (pp.163, 165), as in FY2026.
[[statements]]
kind = "partial"
re = "^The (City )?Council (for Fiscal 2025 and )?will designate \\$(?P<reserve>[\\d,]+|\\d+(\\.\\d+)? million) post-adoption and (has designated and )?h ?as designate ?d \\$(?P<designated>[\\d,]+|\\d+(\\.\\d+)? million) to the following (providers?|organizations)( (for|in) Fiscal 2025)? ?[:.]$"
[[statements]]
kind = "reserve_only"
re = "^The (City )?Council will designate \\$(?P<reserve>[\\d,]+) post[- ]adoption( for Fiscal 2025)? ?[.:]$"
[[statements]]
kind = "reserve_all"
re = "^The (City )?Council will designate awards post-adoption ?[.:]$"
[[statements]]
kind = "direct"
re = "^The (City )?Council has designated (\\$(?P<designated>[\\d,]+) )?directly to the City University of New York( and \\$[\\d,]+ directly to the Department of Education| for the following institutes)?\\.?$"
[[statements]]
kind = "direct"
re = "^This funding is directly allocated to the (Brooklyn Public Library|New York Public Library|Queens Borough Public Library|Research Library)\\.$"
[[statements]]
kind = "full"
re = "^The (City )?Council h ?as designated the following providers? for Fiscal 2025 ?[:.]$"

# Image lattice and ink: FY2027's values (same 10-11 pt body type). On FY2025 they give 0 ink
# regions (30 loose px of 276,778,130 ink px) and 9,577 of 9,579 rows agreeing on every field.
[image]
dpi = 300
kernel_px = 60
region_pad_px = 8
row_tol_pt = 1.0
extra_roles = [["institute", "org"]]   # p.156: the image side's header word for the name column
char_pad_px = 1
rule_pad_px = 1
ink_cell_px = 16
ink_min_region_px = 64
ink_acceptance_page = 169
ink_acceptance_award_id = "fy25-p169-t01-r001"   # Bronx Defenders $5,533,333, one of the 13 rows the old parser lost
ink_acceptance_char = "alnum"   # the row's smallest box is a comma, below the region floor


# A category with no summary table (code/schedc/reconcile.py H10.no_summary). Parks and
# Recreation Services (p.202) prints its banner, one box (Parks Equity Initiative $5,368,500)
# and its award table; no "Fiscal 2025 ... Initiatives" table and no TOTAL line. Known going in
# (PLAN §10, PR 11: "Parks has no summary table, recorded").
[[no_summary]]
category = "Parks and Recreation Services"
page = 202
note = "Parks and Recreation Services prints no summary table or TOTAL (p.202)"

# Pages read with other pdfplumber table settings than its defaults (code/schedc/vector.py).
# p.167 (Immigrant Opportunities Initiative): the award table's left rule is drawn at x=67.2,
# 3 pt right of the box above it (x=64.4); the default snap (3 pt) moves it onto 64.4, its
# row rules (from 67.7) no longer meet it, and the whole name column is lost (10 rows read
# with an EIN and an amount but no name). Snapping at 1 pt keeps the two rules apart.
[[vector_pages]]
page = 167
snap_tolerance = 1
note = "name column lost at default snap"

# Named exceptions: places where the PDF disagrees with itself or prints a value that is not
