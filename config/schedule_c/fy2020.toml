# FY2020 Schedule C: every year-specific fact the pipeline needs, and nothing else (PLAN §7).
# Each value cites the page it was read from. Shared code lives in code/schedc/.

fiscal_year = 2020
pdf = "source/FY20/Fiscal-2020-Schedule-C-Final-Merge.pdf"
sha256 = "8bab407917eb1aa2e274bb19ae4176ac314344bab70028821c0c8b0786c578d4"
pages = 405
x_tolerance = 3.0          # pdfplumber default; FY2020 text has real space glyphs (PLAN §2.2)
review_dir = "research/2026-10-22-fy20-schedule-c-review"   # outputs land in <review_dir>/data
# Disclosure (report only): data/fy20/expense_disclosure. There was no 2026-10-19 prototype for
# FY2020, so no H17 floor (0).
