what_to_check = "p.46: the EINs of New York Foundling Hospital ($210,000, printed 11-3431280), North Brooklyn Coalition Against Family Violence ($320,000, printed 13-2946970) and Safe Horizon ($748,000, printed 13-3540337) look shifted one row: 13-2946970 is Safe Horizon's EIN on p.78, 13-3540337 is the Violence Intervention Program's on the next row. Kept as printed. Which EIN belongs to which row?"
