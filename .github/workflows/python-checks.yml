# The Python checks the PDF tables depend on (#200). Before this, they were run by hand before
# each promotion PR (PDF-RECIPE.md Step 5); ci.yml runs only the MCP and explorer tests.
#
#   tests       python -m pytest code
#               code/build_review_suggestions.py --check   (data/pdf_review_suggestions.csv is current)
#   promoted    code/build_pdf_promoted.py --check         (every data/fy*/pdf/** table and
#               data/pdf_years.csv equal a fresh run of the readers on the PDFs in source/)
#
# The two jobs run side by side; each re-reads every promoted PDF family-year (`pytest code`
# through test_build_pdf_promoted.py, the other through --check): about 20-30 minutes on a laptop,
# about an hour on a hosted runner. Nothing parsed is cached between runs, on purpose: the check
# exists to prove the committed tables come from the PDFs and code in this commit.
#
# macOS runners, not Linux: the promoted tables are built on macOS (arm64), and on Linux x86_64,
# with the same library versions, the image checks count a few pixels differently (H9.ink
# "uncovered ink, 69 px" vs "72 px" in fy22/fy24 transparency), so a Linux run reports drift on
# correct data. Until the readers give the same bytes on both, CI checks on the platform the data
# is built on. Full history (fetch-depth: 0) so test_diff_disclosure_snapshots runs.
#
# Python 3.12 and the two requirement files PDF-RECIPE.md's venv uses (code/requirements.txt,
# code/requirements-cv.txt). The PDFs are committed under source/, so a plain checkout has them.
# Keep the paths below and code/test_ci_python_checks.py in step.

name: Python checks

on:
  pull_request:
    branches: [main]
    paths:
      - "code/**"
      - "config/**"
      - "data/fy*/pdf/**"
      - "data/pdf_years.csv"
      - "data/pdf_review_suggestions.csv"
      - "research/*/data/**"
      - "source/**"
      - ".github/workflows/python-checks.yml"
  push:
    branches: [main]
    paths:
      - "code/**"
      - "config/**"
      - "data/fy*/pdf/**"
      - "data/pdf_years.csv"
      - "data/pdf_review_suggestions.csv"
      - "research/*/data/**"
      - "source/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  # A newer push to a PR replaces its older run; a run on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: pytest + review suggestions
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            code/requirements.txt
            code/requirements-cv.txt

      - name: Install
        run: python -m pip install -r code/requirements.txt -r code/requirements-cv.txt pytest

      - name: pytest
        run: python -m pytest code

      - name: Review suggestions are current
        run: python code/build_review_suggestions.py --check

  promoted:
    name: Promoted PDF tables match the PDFs
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            code/requirements.txt
            code/requirements-cv.txt

      - name: Install
        run: python -m pip install -r code/requirements.txt -r code/requirements-cv.txt

      # Exit 1 and a DRIFT line per file if any promoted table differs from a fresh run.
      - name: build_pdf_promoted --check
        run: python code/build_pdf_promoted.py --check
