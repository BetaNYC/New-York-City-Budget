# Publish the checked PDF tables as a GitHub Release (W7, #216; epic #190).
#
# What `npx @betanyc/nyc-budget-mcp download --pdf-tables [--pdfs]` installs (mcp/src/pdfdata.ts):
# the newest published, non-draft, non-prerelease release tagged `pdf-tables-*` that carries
# `pdf-tables.manifest.json`. The format is in mcp/README.md, "The release format".
#
# When: a push to main that changes the PDF tables or the scripts that build them (paths below).
# Never on a pull request or a fork. workflow_dispatch runs it by hand on main; its `dry_run`
# input (default true) builds and checks but publishes nothing.
#
# Off until a maintainer turns it on: a push publishes only when the repository variable
# PDF_TABLES_AUTO_PUBLISH is "true" (Settings > Secrets and variables > Actions > Variables).
# Until then a push builds and checks only, and the first release is a hand run with dry_run
# unchecked. mcp/README.md, "Publishing a release", has the first-run steps.
#
#   1. build (contents: read): the release with mcp/scripts/build-pdf-release.mjs --pdfs (never
#      --allow-local-commit), then mcp/scripts/verify-pdf-release.mjs: every file's size and
#      sha256 against the manifest (and the tables' unpacked bytes), the manifest parses as the
#      downloader reads it, the tables were built from the pushed commit with
#      source_commit_check "pdfs_match" and source_commit_scope "origin/main" (never "local"),
#      data/ and source/ are clean, and the commit is on origin/main. Then the downloader itself
#      installs the tables from the folder, into a throwaway data dir. The checked files go to
#      the next job as a workflow artifact.
#   2. publish (contents: write, only this job; no npm install, no repo code run): re-checks
#      every file's sha256 against the manifest, refuses unless the commit is main's tip right
#      now (and a re-run of a push run, which keeps its old commit), then creates a draft release tagged
#      pdf-tables-YYYY-MM-DD-<7-digit sha> at the pushed commit, uploads the files, and only
#      then publishes it, so the downloader never sees a half-uploaded release (it skips drafts);
#      a failure before publishing deletes the draft.
#      Marked not "latest", so the npm releases (release.yml, mcp-v* tags) keep that badge.
#
# Actions are pinned by commit (the version in a comment), as this workflow can write releases.
#
# npm publishing is release.yml's (mcp-v* tags) and is untouched.

name: PDF tables release

on:
  push:
    branches: [main]
    paths:
      - "data/fy*/pdf/**"
      - "data/pdf_years.csv"
      - "research/*/data/*_review_decisions.csv"
      - "mcp/scripts/build-index.mjs"
      - "mcp/scripts/build-pdf-release.mjs"
      - "mcp/scripts/verify-pdf-release.mjs"
      - "mcp/scripts/pdf-families.mjs"
      - "mcp/scripts/source-commit.mjs"
      - "mcp/src/pdfdata.ts" # PDF_TABLES_FORMAT: a format change needs a new release
      - "source/FY*/**" # the PDFs a --pdfs release carries
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; publish nothing (uncheck to publish a release from main)"
        type: boolean
        default: true

# Nothing by default; each job asks for what it needs.
permissions: {}

# One release build at a time, in order; a newer push waits rather than cancelling one mid-upload.
concurrency:
  group: pdf-tables-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the PDF tables release
    # This repository's main branch only: never a fork, never another branch.
    if: github.repository == 'BetaNYC/New-York-City-Budget' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    defaults:
      run:
        working-directory: mcp
    steps:
      # Full history, so origin/main is there for the "commit is on main" checks.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      # `prepare` builds dist/ (the downloader the check below uses) and the spreadsheet index.
      - name: Install
        run: npm ci

      - name: The checkout is the pushed commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build the release (tables and PDFs)
        run: node scripts/build-pdf-release.mjs --out "$RUNNER_TEMP/pdf-release" --pdfs

      - name: Check it (sha256 manifest, commit, clean tree)
        run: node scripts/verify-pdf-release.mjs --dir "$RUNNER_TEMP/pdf-release" --commit "$GITHUB_SHA"

      - name: The downloader installs it (local folder, throwaway data dir)
        env:
          NYC_BUDGET_DATA_DIR: ${{ runner.temp }}/install-check
        run: node dist/index.js download --pdf-tables --from "$RUNNER_TEMP/pdf-release/pdf-tables.manifest.json"

      - name: Tag and notes
        id: tag
        run: |
          set -euo pipefail
          TAG=$(node --input-type=module -e 'import { releaseTag } from "./scripts/verify-pdf-release.mjs"; console.log(releaseTag(new Date(), process.env.GITHUB_SHA))')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          OUT="$RUNNER_TEMP/upload"
          mkdir -p "$OUT"
          # Exactly the files the check listed: the tables, the PDFs, the manifest last.
          while IFS= read -r f; do cp "$RUNNER_TEMP/pdf-release/$f" "$OUT/"; done < "$RUNNER_TEMP/pdf-release/release-assets.txt"
          cp "$RUNNER_TEMP/pdf-release/release-assets.txt" "$OUT/"
          node --input-type=module -e 'import { releaseNotes } from "./scripts/verify-pdf-release.mjs"; releaseNotes(process.argv[1], process.argv[2])' "$RUNNER_TEMP/pdf-release" "$OUT/release-notes.md"
          echo "Release $TAG: $(wc -l < "$OUT/release-assets.txt") files, $(du -sh "$OUT" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the checked files to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-tables-release
          path: ${{ runner.temp }}/upload
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    # A push to main once PDF_TABLES_AUTO_PUBLISH is "true", or a hand run with dry_run unchecked.
    # Same repository and branch guard.
    if: >-
      github.repository == 'BetaNYC/New-York-City-Budget' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.PDF_TABLES_AUTO_PUBLISH == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the tag and the release; nothing else
    steps:
      - name: Get the checked files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdf-tables-release
          path: release

      - name: Check every file against the manifest again
        working-directory: release
        run: |
          set -euo pipefail
          jq -r '.files[] | "\(.sha256)  \(.name)"' pdf-tables.manifest.json | sha256sum --check --strict --quiet
          test "$(tail -n 1 release-assets.txt)" = "pdf-tables.manifest.json"
          echo "Every file matches the manifest."

      # The downloader installs the newest published release, so publishing an older commit (a
      # "Re-run jobs" of an old run keeps its old commit but gets today's date) would roll users
      # back. Only the commit that is main's tip right now is published.
      - name: The commit is main's tip now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::error::main is now at $TIP, not this run's commit $GITHUB_SHA; nothing published. The run for the newer commit publishes it, or run the workflow by hand on main."
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::This is attempt $GITHUB_RUN_ATTEMPT of a push run; nothing published. Run the workflow by hand on main instead (Actions > PDF tables release > Run workflow)."
            exit 1
          fi

      - name: Create the release (draft, upload, then publish)
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in pdf-tables-20[0-9][0-9]-[01][0-9]-[0-3][0-9]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) echo "::error::unexpected tag '$TAG'"; exit 1 ;; esac
          if DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2> /dev/null); then
            if [ "$DRAFT" = "true" ]; then
              echo "::error::A draft release tagged $TAG exists, left by a run that did not finish; nothing published. Delete that draft on the Releases page, then run again."
            else
              echo "::error::A release tagged $TAG is already published (this commit, today); nothing to do."
            fi
            exit 1
          fi
          # From here on this step owns the draft: if anything fails before it is published,
          # delete it, so the next run starts clean and the downloader never sees it.
          OURS=0
          DONE=0
          cleanup() {
            if [ "$OURS" = 1 ] && [ "$DONE" = 0 ]; then
              echo "::warning::Publishing failed; deleting the draft $TAG."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || echo "::error::Could not delete the draft $TAG; delete it on the Releases page."
            fi
          }
          trap cleanup EXIT
          mapfile -t FILES < release-assets.txt
          OURS=1
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "PDF tables, $(echo "$TAG" | cut -d- -f3-5) ($(echo "$TAG" | cut -d- -f6))" \
            --notes-file release-notes.md "${FILES[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          DONE=1
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
