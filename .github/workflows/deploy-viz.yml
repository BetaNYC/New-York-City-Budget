# Build and deploy the GitHub Pages site: the viz/ notice and frozen legacy explorer, plus the
# in-browser budget explorer at explorer/.
#
# Pages for this repo is configured as "deploy from a branch" (source: gh-pages, /), served at
# https://betanyc.github.io/New-York-City-Budget/. Until the explorer, this workflow published
# viz/ as-is with `git subtree split --prefix viz`. The explorer needs a build step, so the job
# now builds the site and publishes the result:
#
#   1. Build the MCP's index (mcp/: `npm ci` runs prepare = tsc + scripts/build-index.mjs).
#   2. Build the explorer's data: viz/explorer/scripts/build-data.mjs re-runs build-index.mjs and
#      exports budget.db's tables to Parquet. ONE loader: the explorer never parses a CSV itself.
#   3. Test: the Pages notice tests, the explorer's unit tests, and the parity test (the Parquet
#      equals budget.db year by year, and the explorer's queries answer what the MCP answers).
#      A failure stops the deploy; the last good gh-pages stays live.
#   4. Build the app (Vite, relative base, so it works under /New-York-City-Budget/explorer/).
#   5. Assemble the site: everything in viz/ except viz/explorer/ (as the subtree split published
#      it) plus the built explorer in explorer/ (viz/explorer/scripts/assemble-site.mjs).
#   6. Publish: commit the assembled tree with git plumbing (a temporary index, no checkout) and
#      force-push it to gh-pages. Uses only first-party actions plus plain git.
#
# Scope: data/**, mcp/scripts/**, mcp/src/fold.ts, mcp/src/rowlinks.ts (+ publisher-copies.ts) and viz/**
# feed the site, so a data merge redeploys.
# workflow_dispatch is kept for manual redeploys and for the PR that changes this file.
#
# Safety: force-push targets only the generated gh-pages deploy branch (never main). If a run
# fails at any step, nothing is pushed and the last good gh-pages stays live.

name: Deploy viz to Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "mcp/scripts/**"
      - "mcp/src/fold.ts"   # the explorer's text search imports the MCP's fold rule
      - "mcp/src/rowlinks.ts"   # the explorer's source links import the MCP's row-link builder
      - "mcp/src/publisher-copies.ts"
      - "viz/**"
      - ".github/workflows/deploy-viz.yml"
  workflow_dispatch:

# Serialize deploys; a newer push supersedes an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write   # needed to force-push the generated gh-pages branch

jobs:
  deploy:
    name: Build and publish the site to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            mcp/package-lock.json
            viz/explorer/package-lock.json

      - name: Build the MCP index
        working-directory: mcp
        run: npm ci

      - name: Install the explorer
        working-directory: viz/explorer
        run: npm ci

      - name: Build the explorer data (MCP index -> Parquet)
        working-directory: viz/explorer
        run: npm run data

      - name: Test (Pages notice, explorer unit tests, parity with the MCP index)
        run: |
          set -euo pipefail
          python3 viz/test_pages_site.py
          (cd viz/explorer && npm test)

      - name: Build the explorer app
        working-directory: viz/explorer
        run: npm run build

      - name: Assemble the site
        working-directory: viz/explorer
        run: node scripts/assemble-site.mjs --out "$RUNNER_TEMP/site"

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the assembled site into a temporary index (never the checkout's), write it as a
          # tree, and make a parentless commit of it: gh-pages holds exactly the built site.
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages.index"
          git --work-tree="$RUNNER_TEMP/site" add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Deploy Pages from ${GITHUB_SHA}")
          unset GIT_INDEX_FILE
          git push --force origin "${commit}:refs/heads/gh-pages"
